<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nosotros · Edith y Luis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Patrick+Hand&family=Permanent+Marker&display=swap">
<style>
/* Layout: un libro de una sola pantalla; cada capítulo es una hoja que se pasa (swipe / flechas). Look único de papel, sin modo oscuro. */
:root {
  color-scheme: light;
  --desk: #D9E0EA;        /* gris de ella, hacia el azul */
  --paper: #FBF9F4;
  --paper-2: #F1EEE6;
  --ink: #1E2940;
  --ink-soft: #4A5570;
  --azul: #2F6BD8;        /* el color de los dos */
  --azul-claro: #AFC9F4;
  --naranja: #F2892B;     /* de ella */
  --naranja-os: #D2601A;
  --naranja-claro: #F7B777;
  --gris: #8C96A8;        /* de ella */
  --gris-claro: #D5DAE3;
  --amarillo: #FFCB3D;    /* de él */
  --verde: #34A56F;       /* de él */

  --f-marker: "Permanent Marker", "Comic Sans MS", "Chalkboard SE", cursive;
  --f-script: "Caveat", "Segoe Print", "Bradley Hand", cursive;
  --f-body: "Patrick Hand", "Segoe Print", "Chalkboard SE", system-ui, sans-serif;

  --page-max: 540px;
  --ease: cubic-bezier(.2, .7, .2, 1);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--desk);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 19px;
  line-height: 1.55;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px dashed var(--azul); outline-offset: 3px; border-radius: 6px; }

/* ---------- libro ---------- */
.libro {
  position: relative;
  height: 100%;
  max-width: var(--page-max);
  margin: 0 auto;
  display: grid;
  grid-template-rows: 1fr auto;
  background: var(--paper);
  background-image:
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .12  0 0 0 0 .16  0 0 0 0 .25  0 0 0 .05 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  box-shadow: 0 0 0 1px rgba(30, 41, 64, .08), 0 18px 50px rgba(30, 41, 64, .18);
  overflow: hidden;
}
.hojas { position: relative; overflow: hidden; }
.hoja {
  position: absolute; inset: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 28px 22px 36px;
  display: flex; flex-direction: column; gap: 18px;
  transition: transform .5s var(--ease), opacity .5s var(--ease);
  transform: translateX(0) rotate(0);
  opacity: 1;
}
.hoja[data-pos="antes"]   { transform: translateX(-104%) rotate(-3deg); opacity: 0; pointer-events: none; }
.hoja[data-pos="despues"] { transform: translateX(104%) rotate(3deg);  opacity: 0; pointer-events: none; }
.hoja > * { flex-shrink: 0; }

/* ---------- tipografía ---------- */
.eyebrow {
  font-family: var(--f-script); font-weight: 700; font-size: 1.5rem; line-height: 1;
  color: var(--naranja-os);
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
}
.cuando {
  font-family: var(--f-body); font-size: .9rem; letter-spacing: .04em;
  color: var(--ink-soft);
  border: 2px solid currentColor; border-radius: 999px 900px 999px 950px;
  padding: 0 10px; line-height: 1.6;
}
h1, h2 { margin: 0; font-family: var(--f-marker); font-weight: 400; text-wrap: balance; line-height: 1.05; }
h2 { font-size: clamp(1.9rem, 8vw, 2.5rem); }
.resalta {
  background: linear-gradient(transparent 58%, var(--hl, var(--amarillo)) 58%, var(--hl, var(--amarillo)) 90%, transparent 90%);
  padding: 0 .1em;
  -webkit-box-decoration-break: clone; box-decoration-break: clone;
}
.texto { display: flex; flex-direction: column; gap: 12px; max-width: 34em; }
.texto p { margin: 0; }
.script { font-family: var(--f-script); font-weight: 700; font-size: 1.35em; line-height: 1.1; color: var(--azul); }

/* ---------- dibujos ---------- */
.doodle { width: 100%; max-width: 300px; height: auto; align-self: center; overflow: visible; }
.doodle .k { stroke: var(--ink); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.doodle .w { filter: url(#wobble); }
.f-none { fill: none; }
.f-ink { fill: var(--ink); }
.f-paper { fill: var(--paper); }
.f-azul { fill: var(--azul); }
.f-azul-claro { fill: var(--azul-claro); }
.f-naranja { fill: var(--naranja); }
.f-naranja-os { fill: var(--naranja-os); }
.f-naranja-claro { fill: var(--naranja-claro); }
.f-gris { fill: var(--gris); }
.f-gris-claro { fill: var(--gris-claro); }
.f-amarillo { fill: var(--amarillo); }
.f-verde { fill: var(--verde); }
.t-marker { font-family: var(--f-marker); }
.t-script { font-family: var(--f-script); font-weight: 700; }

/* ---------- polaroid (aparece sólo si existe la foto) ---------- */
.polaroid {
  align-self: center;
  width: min(78%, 280px);
  background: #fff;
  padding: 10px 10px 34px;
  box-shadow: 0 6px 18px rgba(30, 41, 64, .18);
  transform: rotate(var(--rot, -2deg));
  position: relative;
}
.polaroid img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; background: var(--paper-2); }
.polaroid::before {
  content: ""; position: absolute; top: -12px; left: 50%; width: 84px; height: 24px;
  transform: translateX(-50%) rotate(3deg);
  background: color-mix(in srgb, var(--amarillo) 55%, transparent);
}

/* ---------- nota escondida ---------- */
.nota {
  align-self: flex-start;
  max-width: 290px;
  border: 0;
  background: var(--amarillo);
  padding: 12px 16px 14px;
  text-align: left;
  box-shadow: 2px 4px 0 rgba(30, 41, 64, .15);
  transform: rotate(-1.5deg);
  transition: transform .2s var(--ease);
  min-height: 44px;
}
.nota:hover { transform: rotate(0); }
.nota .tapa { font-family: var(--f-script); font-weight: 700; font-size: 1.4rem; line-height: 1.1; }
.nota .dentro { display: block; font-size: 1.05rem; }
.nota[aria-expanded="false"] .dentro { display: none; }
.nota[aria-expanded="true"] .tapa { display: none; }

.recuerdo {
  display: flex; gap: 12px; align-items: center;
  font-family: var(--f-script); font-size: 1.35rem; line-height: 1.15; color: var(--ink-soft);
  border-top: 2px dashed var(--gris-claro); padding-top: 14px;
}
.recuerdo svg { flex: none; }

.lista { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.lista li { display: flex; align-items: center; gap: 12px; }
.lista svg { flex: none; }

/* ---------- capítulo en pausa ---------- */
.hoja.pausa { background: var(--paper-2); color: var(--ink-soft); }
.hoja.pausa h2 { color: var(--gris); }
.hoja.pausa .eyebrow { color: var(--gris); }

/* ---------- portada ---------- */
.portada { justify-content: center; align-items: center; text-align: center; gap: 14px; }
.portada h1 { font-size: clamp(3.2rem, 17vw, 5rem); letter-spacing: .02em; display: flex; align-items: center; justify-content: center; }
.portada h1 svg { width: .85em; height: .85em; margin: 0 .02em; }
.nombres { font-family: var(--f-script); font-weight: 700; font-size: clamp(2.1rem, 10vw, 2.8rem); line-height: 1; color: var(--azul); }
.apodos { font-family: var(--f-script); font-size: 1.4rem; color: var(--naranja-os); line-height: 1.1; }
.subt { color: var(--ink-soft); margin: 0; }
.boton {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 48px; padding: 8px 24px;
  font-family: var(--f-marker); font-size: 1.15rem;
  background: var(--azul); color: var(--paper);
  border: 3px solid var(--ink);
  border-radius: 255px 18px 225px 18px / 18px 225px 18px 255px;
  box-shadow: 3px 4px 0 var(--ink);
  transition: transform .15s var(--ease), box-shadow .15s var(--ease);
}
.boton:hover { transform: translate(-1px, -1px); box-shadow: 4px 5px 0 var(--ink); }
.boton:active { transform: translate(2px, 3px); box-shadow: 1px 1px 0 var(--ink); }
.boton.sec { background: var(--paper); color: var(--ink); }

/* ---------- índice ---------- */
.indice { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.indice button {
  width: 100%; min-height: 48px;
  display: grid; grid-template-columns: 2.4em 1fr; align-items: baseline; gap: 8px;
  background: none; border: 0; border-bottom: 2px dashed var(--gris-claro);
  padding: 8px 4px; text-align: left;
  transition: background-color .2s;
}
.indice button:hover { background: color-mix(in srgb, var(--amarillo) 30%, transparent); }
.indice .num { font-family: var(--f-script); font-weight: 700; font-size: 1.5rem; color: var(--naranja-os); line-height: 1; }
.indice .tit { font-size: 1.1rem; min-width: 0; }

/* ---------- final: la servilleta ---------- */
.servilleta {
  position: relative;
  align-self: center;
  width: min(100%, 340px);
  background:
    repeating-linear-gradient(0deg, transparent 0 22px, rgba(47, 107, 216, .06) 22px 23px),
    #fff;
  padding: 26px 24px 24px;
  box-shadow: 0 10px 26px rgba(30, 41, 64, .2);
  transform: rotate(-2deg);
  clip-path: polygon(0 2%, 4% 0, 12% 1.5%, 22% 0, 35% 1%, 48% 0, 60% 1.6%, 74% 0, 86% 1.2%, 100% 0, 99% 20%, 100% 45%, 98.6% 70%, 100% 100%, 88% 98.6%, 70% 100%, 50% 98.4%, 30% 100%, 12% 98.5%, 0 100%, 1.2% 70%, 0 40%);
}
.servilleta::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(135deg, transparent 49.6%, rgba(30, 41, 64, .07) 50%, transparent 50.4%);
  pointer-events: none;
}
.servilleta .para { font-family: var(--f-script); font-weight: 700; font-size: 1.7rem; line-height: 1; color: var(--ink-soft); }
.servilleta .pregunta { font-family: var(--f-script); font-weight: 700; font-size: clamp(2.3rem, 11vw, 2.9rem); line-height: 1; color: var(--ink); margin: 8px 0 4px; text-wrap: balance; }
.servilleta .otra { font-family: var(--f-script); font-size: 1.6rem; color: var(--naranja-os); line-height: 1; }
.opciones { display: flex; gap: 28px; margin-top: 22px; align-items: center; flex-wrap: wrap; }
.check {
  display: inline-flex; align-items: center; gap: 10px;
  min-height: 48px; min-width: 48px;
  background: none; border: 0; padding: 4px 6px;
  font-family: var(--f-script); font-weight: 700; font-size: 2rem; line-height: 1;
  transition: transform .25s var(--ease);
  transform-origin: left center;
  touch-action: manipulation;
}
.check .caja { width: 34px; height: 34px; flex: none; }
.check .palomita { stroke-dasharray: 60; stroke-dashoffset: 60; transition: stroke-dashoffset .5s var(--ease); }
.check.marcado .palomita { stroke-dashoffset: 0; }
#btnNo.huye { position: fixed; z-index: 30; transition: left .25s var(--ease), top .25s var(--ease), transform .25s; background: var(--paper); border-radius: 12px; box-shadow: 0 4px 14px rgba(30, 41, 64, .18); }
.respuesta { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.respuesta .grande { font-family: var(--f-marker); font-size: clamp(1.8rem, 8vw, 2.3rem); line-height: 1.1; text-wrap: balance; }

/* ---------- epílogo ---------- */
.ideas { display: flex; flex-wrap: wrap; gap: 8px; }
.idea {
  min-height: 44px; padding: 6px 14px;
  background: var(--paper); border: 2px solid var(--ink-soft);
  border-radius: 999px 900px 999px 950px;
  font-size: 1rem;
  transition: background-color .2s, border-color .2s;
}
.idea:hover { background: color-mix(in srgb, var(--azul-claro) 45%, transparent); border-color: var(--azul); }
label.lbl { font-family: var(--f-script); font-weight: 700; font-size: 1.5rem; line-height: 1; }
textarea {
  width: 100%; min-height: 120px; resize: vertical;
  font-family: var(--f-script); font-weight: 700; font-size: 1.7rem; line-height: 1.2;
  color: var(--ink);
  background: repeating-linear-gradient(0deg, transparent 0 33px, var(--azul-claro) 33px 34px), var(--paper);
  border: 2px solid var(--ink-soft); border-radius: 10px 14px 8px 16px;
  padding: 6px 12px;
}
.firmado {
  font-family: var(--f-script); font-weight: 700; font-size: clamp(2rem, 9vw, 2.6rem); line-height: 1.1;
  color: var(--azul); text-align: center; text-wrap: balance; margin: 0;
}
.firma { text-align: center; font-family: var(--f-script); font-size: 1.4rem; color: var(--ink-soft); margin: 0; }
.fila { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.aviso { font-size: .95rem; color: var(--ink-soft); margin: 0; min-height: 1.5em; }

/* ---------- barra: el camino ---------- */
.camino {
  display: grid; grid-template-columns: 48px 1fr 48px; align-items: center; gap: 6px;
  padding: 6px 10px calc(8px + env(safe-area-inset-bottom, 0px));
  border-top: 2px dashed var(--gris-claro);
  background: var(--paper);
}
.flecha {
  width: 48px; height: 48px; border: 0; background: none; border-radius: 50%;
  display: grid; place-items: center;
  transition: background-color .2s;
}
.flecha:hover:not(:disabled) { background: color-mix(in srgb, var(--amarillo) 45%, transparent); }
.flecha:disabled { opacity: .25; cursor: default; }
.ruta { width: 100%; height: 40px; overflow: visible; }
.ruta .calle { fill: none; stroke: var(--gris-claro); stroke-width: 12; stroke-linecap: round; }
.ruta .raya { fill: none; stroke: var(--paper); stroke-width: 2; stroke-dasharray: 6 6; }
.ruta .parada { fill: var(--paper); stroke: var(--gris); stroke-width: 2; }
.ruta .parada.hecha { fill: var(--azul); stroke: var(--azul); }
.ruta #marcador { transition: transform .5s var(--ease); }
.pagina { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: var(--f-script); font-size: 1.1rem; color: var(--ink-soft); text-align: center; line-height: 1; margin-top: -2px; }

canvas#confeti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 40; }

[hidden] { display: none !important; }
.col { display: flex; flex-direction: column; gap: 12px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (min-width: 600px) {
  body { padding-block: 24px; }
  .libro { border-radius: 6px 14px 14px 6px; }
  .hoja { padding: 36px 40px 40px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="3.2"/>
    </filter>
  </defs>
</svg>

<main class="libro" id="libro">
  <div class="hojas" id="hojas" aria-live="polite"></div>
  <nav class="camino" aria-label="Páginas del libro">
    <button class="flecha" id="atras" aria-label="Página anterior">
      <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><path d="M18 5 Q10 12 8 14 Q12 18 18 23" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div>
      <svg class="ruta" id="ruta" viewBox="0 0 300 40" preserveAspectRatio="none" aria-hidden="true">
        <path id="rutaPath" class="calle" d="M8 20 C 45 4, 70 36, 105 20 S 165 4, 200 20 S 260 36, 292 20"/>
        <path class="raya" d="M8 20 C 45 4, 70 36, 105 20 S 165 4, 200 20 S 260 36, 292 20"/>
        <g id="paradas"></g>
        <g id="marcador"><path d="M0 5 C -9 -3 -7 -11 0 -6 C 7 -11 9 -3 0 5 Z" fill="var(--naranja)" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round"/></g>
      </svg>
      <div class="pagina" id="pagina"></div>
    </div>
    <button class="flecha" id="adelante" aria-label="Página siguiente">
      <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><path d="M10 5 Q18 12 20 14 Q16 18 10 23" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </nav>
</main>
<canvas id="confeti" hidden></canvas>

<script>
/* =========================================================
   LA HISTORIA — edita aquí los textos.
   Fotos: pon archivos en /fotos con el nombre de "foto"
   (ej. fotos/cap-01.jpg). Si no existe, sólo se ve el dibujo.
   ========================================================= */
const ELLA = "Edith";
const EL = "Luis";

const CAPITULOS = [
  {
    titulo: "Me gusta tu sudadera", cuando: "2019 · la prepa", dibujo: "sudadera", foto: "fotos/cap-01.jpg",
    texto: [
      "Yo iba en segundo, tú en tercero, tu último año. Yo estaba afuera de un baño con mi sudadera de Morat.",
      "Pasaste con tu amiga, me dijiste <span class='script'>«me gusta tu sudadera»</span> y te fuiste.",
      "Luego tu amiga te dijo que me pidieras mi Facebook. Lo sé porque casi lo gritó. No te animaste, así que me lo pidió ella y te lo pasó.",
      "Al poco tiempo empezamos a hablar. Todo empezó por una sudadera."
    ],
    nota: "Todavía no sé si te gustó la sudadera o el que la traía puesta."
  },
  {
    titulo: "Nos vemos en el receso", cuando: "2019 · la prepa", dibujo: "reloj", foto: "fotos/cap-02.jpg",
    texto: [
      "Después de eso, el receso se volvió la mejor parte del día.",
      "Nos veíamos diario. Mismo lugar, las mismas ganas de verte, y siempre se nos hacía corto.",
      "Así estuvimos un tiempo, hasta que tocó salir de la escuela juntos."
    ]
  },
  {
    titulo: "El plan de la caja de pizza", cuando: "nuestra primera cita", dibujo: "pizza", foto: "fotos/cap-03.jpg",
    texto: [
      "Nuestra primera cita de verdad fue en una pizzería.",
      "Yo tenía un súper plan: pedirle a los de Domino's que escribieran en la caja si querías ser mi novia, para que lo vieras al abrirla.",
      "Nunca nos llevaron caja.",
      "Así que te lo escribí en una servilleta. <span class='script'>Y dijiste que sí.</span>"
    ],
    nota: "El plan falló. La servilleta no."
  },
  {
    titulo: "Seis meses", cuando: "novios, la primera vez", dibujo: "kermes", foto: "fotos/cap-04.jpg",
    texto: [
      "Fueron como seis meses, pero cupieron un montón de cosas.",
      "Te acompañaba a tu casa. Nos casamos en una kermés. Me diste varios regalos y yo a ti.",
      "Y yo te cantaba canciones."
    ],
    nota: "Técnicamente seguimos casados por la kermés, ¿no?"
  },
  {
    titulo: "Intermedio", cuando: "2020", dibujo: "nube", pausa: true,
    texto: [
      "Luego llegó la pandemia y todo se detuvo. Nosotros también.",
      "La relación terminó y perdimos contacto un buen tiempo.",
      "Esta página se queda un poco gris, porque así se sintió."
    ]
  },
  {
    titulo: "Siempre amigos", cuando: "los años después", dibujo: "cassette", foto: "fotos/cap-06.jpg",
    texto: [
      "Pero nunca nos fuimos del todo. Volvimos a hablar y con los años vivimos de todo.",
      "Un día me dedicaste una canción de Little Jesus, y se volvió una de mis bandas favoritas.",
      "Aparte de haber sido novios, siempre fuimos amigos. Muy unidos, con una conexión que yo diría que es única.",
      "Y tenemos fotos de todo para comprobarlo."
    ],
    nota: "Little Jesus ya está en las dos playlists: la tuya y la mía."
  },
  {
    titulo: "Primeras veces", cuando: "contigo", dibujo: "boleto", foto: "fotos/cap-07.jpg",
    texto: [
      "Contigo vi a Little Jesus en vivo por primera vez.",
      "Contigo me quedé en un Airbnb por primera vez.",
      "Hay cosas que uno sólo quiere estrenar con una persona."
    ]
  },
  {
    titulo: "Verte crecer", cuando: "de 2019 a hoy", dibujo: "casa", foto: "fotos/cap-08.jpg",
    texto: [
      "Te vi independizarte.",
      "Conocí a Omali, tu gatita. Estuve cuando te regalaron a Rayo. Ya conozco tu casa.",
      "Te he visto convertirte en quien eres, y cada versión tuya me ha gustado más."
    ],
    recuerdo: "Para Omali, que se fue en junio. En este libro se queda para siempre."
  },
  {
    titulo: "Lo que tenemos", cuando: "hoy", dibujo: "audifonos", foto: "fotos/cap-09.jpg",
    texto: [
      "Por una razón o por otra nunca regresamos. Pero nunca dejamos de gustarnos."
    ],
    lista: [
      ["Casi la misma música", true],
      ["El mismo humor", true],
      ["Las mismas ganas de vivir juntos", true],
      ["Tu familia ya me conoce", true],
      ["Conciertos por delante", false]
    ]
  },
  {
    titulo: "Esta vez", cuando: "ahora", dibujo: "letrero", foto: "fotos/cap-10.jpg",
    texto: [
      "Nos conocemos desde 2019. Hemos sido novios, amigos y casi todo lo que hay en medio.",
      "Y esta vez lo estamos intentando de verdad.",
      "<span class='script'>Quiero que esta vez funcione.</span>",

/* ---------- navegación ---------- */
let actual = 0;
const N = hojas.length;
const $atras = document.getElementById("atras");
const $adelante = document.getElementById("adelante");
const $pagina = document.getElementById("pagina");
const rutaPath = document.getElementById("rutaPath");
const $paradas = document.getElementById("paradas");
const $marcador = document.getElementById("marcador");
const largo = rutaPath.getTotalLength();
const puntos = hojas.map((_, i) => rutaPath.getPointAtLength(largo * i / (N - 1)));
$paradas.innerHTML = puntos.map(p => `<circle class="parada" cx="${p.x}" cy="${p.y}" r="3.2"/>`).join("");

function ir(i) {
  actual = Math.max(0, Math.min(N - 1, i));
  hojas.forEach((h, j) => {
    h.el.dataset.pos = j < actual ? "antes" : j > actual ? "despues" : "";
    h.el.inert = j !== actual;
  });
  hojas[actual].el.scrollTop = 0;
  $atras.disabled = actual === 0;
  $adelante.disabled = actual === N - 1;
  const p = puntos[actual];
  $marcador.setAttribute("transform", `translate(${p.x} ${p.y - 8})`);
  [...$paradas.children].forEach((c, j) => c.classList.toggle("hecha", j <= actual));
  $pagina.textContent = hojas[actual].etiqueta;
}

$atras.onclick = () => ir(actual - 1);
$adelante.onclick = () => ir(actual + 1);
document.addEventListener("keydown", e => {
  if (e.target.closest("textarea")) return;
  if (e.key === "ArrowRight") ir(actual + 1);
  if (e.key === "ArrowLeft") ir(actual - 1);
});
document.addEventListener("click", e => {
  const b = e.target.closest("[data-ir]");
  if (b) ir(+b.dataset.ir);
  const n = e.target.closest(".nota");
  if (n) n.setAttribute("aria-expanded", n.getAttribute("aria-expanded") === "true" ? "false" : "true");
});

let x0 = null, y0 = null;
$h.addEventListener("pointerdown", e => {
  if (e.target.closest("button, textarea, a")) { x0 = null; return; }
  x0 = e.clientX; y0 = e.clientY;
});
$h.addEventListener("pointerup", e => {
  if (x0 === null) return;
  const dx = e.clientX - x0, dy = e.clientY - y0;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.3) ir(actual + (dx < 0 ? 1 : -1));
  x0 = null;
});

/* ---------- la pregunta ---------- */
const $si = document.getElementById("btnSi");
const $no = document.getElementById("btnNo");
const $noTxt = document.getElementById("noTxt");
const frasesNo = ["¿Segura?", "Piénsalo", "¿Neta?", "Ese no sirve", "Dale al sí"];
let intentos = 0;

function huir(e) {
  if (e) e.preventDefault();
  intentos++;
  $noTxt.textContent = frasesNo[Math.min(intentos - 1, frasesNo.length - 1)];
  $si.style.transform = `scale(${Math.min(1 + intentos * .12, 1.7)})`;
  const r = $no.getBoundingClientRect();
  $no.classList.add("huye");
  const w = r.width, h = r.height, m = 16;
  const x = m + Math.random() * Math.max(0, innerWidth - w - m * 2);
  const y = m + Math.random() * Math.max(0, innerHeight - h - 120);
  $no.style.left = x + "px";
  $no.style.top = y + "px";
  if (intentos >= 7) $no.hidden = true;
}
$no.addEventListener("pointerenter", e => { if (e.pointerType === "mouse") huir(); });
$no.addEventListener("pointerdown", huir);
$no.addEventListener("click", huir);

$si.addEventListener("click", () => {
  $si.classList.add("marcado");
  $si.style.transform = "";
  $no.hidden = true;
  const r = document.getElementById("respuesta");
  r.hidden = false;
  setTimeout(() => r.scrollIntoView({ behavior: "smooth", block: "center" }), 350);
  confeti();
});

/* ---------- confeti ---------- */
function confeti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = document.getElementById("confeti");
  cv.hidden = false;
  const ctx = cv.getContext("2d");
  const dpr = devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  ctx.scale(dpr, dpr);
  const css = getComputedStyle(document.documentElement);
  const colores = ["--azul", "--naranja", "--amarillo", "--verde", "--gris", "--azul-claro"].map(v => css.getPropertyValue(v).trim());
  const ps = Array.from({ length: 150 }, () => ({
    x: innerWidth / 2 + (Math.random() - .5) * 80, y: innerHeight * .55,
    vx: (Math.random() - .5) * 13, vy: -Math.random() * 15 - 6,
    r: Math.random() * Math.PI, vr: (Math.random() - .5) * .3,
    s: 6 + Math.random() * 7, c: colores[Math.floor(Math.random() * colores.length)],
    h: Math.random() < .3
  }));
  const t0 = performance.now();
  (function paso(t) {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    ps.forEach(p => {
      p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;
      if (p.h) {
        const s = p.s / 7;
        ctx.scale(s, s);
        ctx.beginPath(); ctx.moveTo(0, 6);
        ctx.bezierCurveTo(-11, -4, -8, -13, 0, -7); ctx.bezierCurveTo(8, -13, 11, -4, 0, 6); ctx.fill();
      } else ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
      ctx.restore();
    });
    if (t - t0 < 3800) requestAnimationFrame(paso); else { ctx.clearRect(0, 0, innerWidth, innerHeight); cv.hidden = true; }
  })(t0);
}

/* ---------- epílogo ---------- */
const $ta = document.getElementById("epilogo");
const $editor = document.getElementById("editor");
const $firmado = document.getElementById("firmado");
const $aviso = document.getElementById("aviso");
const fecha = new Date().toLocaleDateString("es-MX", { day: "numeric", month: "long", year: "numeric" });

function mostrarFirmado(texto, cuando) {
  document.getElementById("frase").textContent = "«" + texto + "»";
  document.getElementById("firma").textContent = `— ${ELLA} & ${EL}, ${cuando}`;
  $editor.hidden = true;
  $firmado.hidden = false;
}
document.querySelectorAll(".idea").forEach(b => b.onclick = () => { $ta.value = b.textContent; $ta.focus(); });
document.getElementById("guardar").onclick = () => {
  const t = $ta.value.trim();
  if (!t) { $aviso.textContent = "Escriban algo primero. Aunque sea una palabra."; $ta.focus(); return; }
  try { localStorage.setItem("nosotros:epilogo", JSON.stringify({ t, fecha })); } catch (e) {}
  mostrarFirmado(t, fecha);
  confeti();
};
document.getElementById("editar").onclick = () => {
  $firmado.hidden = true;
  $editor.hidden = false;
  $ta.focus();
};
try {
  const g = JSON.parse(localStorage.getItem("nosotros:epilogo") || "null");
  if (g && g.t) { $ta.value = g.t; mostrarFirmado(g.t, g.fecha); }
} catch (e) {}
ir(0);
</script>
