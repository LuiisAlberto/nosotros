<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1026">
  <meta name="robots" content="noindex">
  <title>Nuestra historia</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23e8c27a' d='M12 2l2.9 6.9L22 9.3l-5.5 4.8L18.2 22 12 18.3 5.8 22l1.7-7.9L2 9.3l7.1-.4z'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <canvas id="estrellas-fondo" aria-hidden="true"></canvas>

  <main id="app" aria-live="polite">
    <!-- Pantalla de bloqueo (solo modo QR) -->
    <section class="escena" id="bloqueo" hidden>
      <div class="bloqueo">
        <svg class="icono icono-xl" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        <p class="eyebrow" id="bloqueo-capitulo"></p>
        <h1 class="titulo">Aún no es momento</h1>
        <p class="texto" id="bloqueo-pista"></p>
      </div>
    </section>

    <!-- Capítulo 1: La carta -->
    <section class="escena" id="carta" hidden>
      <p class="eyebrow">Capítulo I</p>
      <div class="sobre" id="sobre">
        <button class="sobre-boton" id="sobre-abrir" aria-label="Abrir el sobre">
          <span class="sobre-cuerpo"></span>
          <span class="sobre-solapa"></span>
          <span class="sobre-sello" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.5-9.2C1 8.3 3.2 5 6.6 5c2 0 3.4 1 4.4 2.4h2C14 6 15.4 5 17.4 5 20.8 5 23 8.3 21.5 11.8 19.5 16.4 12 21 12 21z"/></svg>
          </span>
          <span class="sobre-nombre" id="sobre-nombre"></span>
        </button>
        <p class="ayuda" id="sobre-ayuda">Toca el sobre para abrirlo</p>
      </div>

      <article class="carta" id="carta-papel" hidden>
        <p class="carta-saludo" id="carta-saludo"></p>
        <div class="carta-cuerpo" id="carta-cuerpo"></div>
        <p class="carta-firma" id="carta-firma"></p>
        <button class="boton" id="carta-siguiente"></button>
      </article>
    </section>

    <!-- Capítulo 2: Los acertijos -->
    <section class="escena" id="acertijos" hidden>
      <header class="cabecera">
        <p class="eyebrow">Capítulo II · Los acertijos</p>
        <ol class="puntos" id="acertijo-progreso" aria-label="Progreso"></ol>
      </header>

      <div class="tarjeta" id="acertijo-tarjeta">
        <p class="contador" id="acertijo-numero"></p>
        <h2 class="titulo" id="acertijo-pregunta"></h2>
        <div class="opciones" id="acertijo-opciones" role="group"></div>
        <p class="pista" id="acertijo-pista" hidden></p>
      </div>

      <figure class="recuerdo" id="recuerdo" hidden>
        <div class="recuerdo-foto" id="recuerdo-foto"></div>
        <figcaption>
          <p class="recuerdo-meta"><span id="recuerdo-fecha"></span><span aria-hidden="true"> · </span><span id="recuerdo-lugar"></span></p>
          <h3 class="titulo" id="recuerdo-titulo"></h3>
          <p class="texto" id="recuerdo-texto"></p>
        </figcaption>
        <button class="boton" id="recuerdo-siguiente">Siguiente</button>
      </figure>
    </section>

    <!-- Capítulo 3: Wrapped -->
    <section class="escena escena-wrapped" id="wrapped" hidden>
      <div class="historias-barras" id="wrapped-barras" aria-hidden="true"></div>
      <div class="historias" id="wrapped-historias"></div>
      <button class="zona-toque zona-atras" id="wrapped-atras" aria-label="Anterior"></button>
      <button class="zona-toque zona-adelante" id="wrapped-adelante" aria-label="Siguiente"></button>
    </section>

    <!-- Capítulo 4: El cielo -->
    <section class="escena escena-cielo" id="cielo" hidden>
      <p class="eyebrow">Capítulo IV</p>
      <p class="cielo-intro" id="cielo-intro"></p>
      <div class="cielo-estrellas" id="cielo-estrellas"></div>
      <p class="frase" id="cielo-frase" aria-live="polite"></p>

      <div class="final" id="final" hidden>
        <svg class="anillo" viewBox="0 0 64 64" aria-hidden="true">
          <circle cx="32" cy="40" r="16"/>
          <path d="M24 16l8-8 8 8-8 8z"/>
        </svg>
        <h1 class="final-pregunta" id="final-pregunta"></h1>
        <div class="final-botones" id="final-botones"></div>
        <p class="texto final-mensaje" id="final-mensaje" hidden></p>
      </div>
    </section>
  </main>

  <canvas id="celebracion" aria-hidden="true"></canvas>
  <audio id="audio" preload="none"></audio>

  <script src="datos.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
