<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nosotros · Edith y Luis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Patrick+Hand&family=Permanent+Marker&display=swap">
<style>
/* Layout: un libro de una sola pantalla; cada capítulo es una hoja que se pasa (swipe / flechas) y se lee hacia abajo por escenas. Look único de papel, sin modo oscuro. */
:root {
  color-scheme: light;
  --desk: #D9E0EA;        /* gris de ella, hacia el azul */
  --paper: #FBF9F4;
  --paper-2: #F1EEE6;
  --ink: #1E2940;
  --ink-soft: #4A5570;
  --azul: #2F6BD8;        /* el color de los dos */
  --azul-claro: #AFC9F4;
  --naranja: #F2892B;     /* de ella */
  --naranja-os: #C9581A;
  --naranja-claro: #F7B777;
  --gris: #8C96A8;        /* de ella */
  --gris-claro: #D5DAE3;
  --amarillo: #FFCB3D;    /* de él */
  --verde: #34A56F;       /* de él */
  --cafe: #9A6A44;
  --blanco: #FFFFFF;

  --f-marker: "Permanent Marker", "Comic Sans MS", "Chalkboard SE", cursive;
  --f-script: "Caveat", "Segoe Print", "Bradley Hand", cursive;
  --f-body: "Patrick Hand", "Segoe Print", "Chalkboard SE", system-ui, sans-serif;

  --page-max: 560px;
  --ease: cubic-bezier(.2, .7, .2, 1);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--desk);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 19px;
  line-height: 1.55;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; }
a { color: var(--azul); }
:focus-visible { outline: 3px dashed var(--azul); outline-offset: 3px; border-radius: 6px; }
[hidden] { display: none !important; }

/* ---------- libro ---------- */
.libro {
  position: relative;
  height: 100%;
  max-width: var(--page-max);
  margin: 0 auto;
  display: grid;
  grid-template-rows: 1fr auto;
  background: var(--paper);
  background-image:
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .12  0 0 0 0 .16  0 0 0 0 .25  0 0 0 .05 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  box-shadow: 0 0 0 1px rgba(30, 41, 64, .08), 0 18px 50px rgba(30, 41, 64, .18);
  overflow: hidden;
}
.hojas { position: relative; overflow: hidden; }
.hoja {
  position: absolute; inset: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 28px 22px 48px;
  display: flex; flex-direction: column; gap: 20px;
  transition: transform .5s var(--ease), opacity .5s var(--ease);
  transform: translateX(0) rotate(0);
  opacity: 1;
}
.hoja[data-pos="antes"]   { transform: translateX(-104%) rotate(-3deg); opacity: 0; pointer-events: none; }
.hoja[data-pos="despues"] { transform: translateX(104%) rotate(3deg);  opacity: 0; pointer-events: none; }
.hoja > * { flex-shrink: 0; }

/* ---------- tipografía ---------- */
.cabeza { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.eyebrow {
  font-family: var(--f-script); font-weight: 700; font-size: 1.5rem; line-height: 1;
  color: var(--naranja-os);
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
}
.cuando {
  font-family: var(--f-body); font-size: .9rem; letter-spacing: .04em;
  color: var(--ink-soft);
  border: 2px solid currentColor; border-radius: 999px 900px 999px 950px;
  padding: 0 10px; line-height: 1.6;
}
h1, h2 { margin: 0; font-family: var(--f-marker); font-weight: 400; text-wrap: balance; line-height: 1.05; }
h2 { font-size: clamp(1.9rem, 8vw, 2.5rem); }
h3 {
  margin: 0; font-family: var(--f-script); font-weight: 700; font-size: 1.65rem; line-height: 1.1;
  color: var(--azul); display: flex; align-items: center; gap: 8px;
}
h3::before { content: ""; width: 18px; height: 3px; background: currentColor; border-radius: 3px; transform: rotate(-6deg); }
.resalta {
  background: linear-gradient(transparent 58%, var(--hl, var(--amarillo)) 58%, var(--hl, var(--amarillo)) 90%, transparent 90%);
  padding: 0 .1em;
  -webkit-box-decoration-break: clone; box-decoration-break: clone;
}
.escena { display: flex; flex-direction: column; gap: 10px; max-width: 34em; }
.escena p { margin: 0; }
.script { font-family: var(--f-script); font-weight: 700; font-size: 1.35em; line-height: 1.1; color: var(--azul); }
em { font-style: normal; color: var(--naranja-os); }
.chico { font-size: .95rem; color: var(--ink-soft); margin: 0; }
.centro { text-align: center; align-self: center; }

/* ---------- dibujos ---------- */
.doodle { width: 100%; max-width: 300px; height: auto; align-self: center; overflow: visible; }
.doodle .k, .mini .k { stroke: var(--ink); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.doodle .w { filter: url(#wobble); }
.f-none { fill: none; }
.f-ink { fill: var(--ink); }
.f-paper { fill: var(--paper); }
.f-blanco { fill: var(--blanco); }
.f-azul { fill: var(--azul); }
.f-azul-claro { fill: var(--azul-claro); }
.f-naranja { fill: var(--naranja); }
.f-naranja-os { fill: var(--naranja-os); }
.f-naranja-claro { fill: var(--naranja-claro); }
.f-gris { fill: var(--gris); }
.f-gris-claro { fill: var(--gris-claro); }
.f-amarillo { fill: var(--amarillo); }
.f-verde { fill: var(--verde); }
.f-cafe { fill: var(--cafe); }
.t-marker { font-family: var(--f-marker); }
.t-script { font-family: var(--f-script); font-weight: 700; }

/* ---------- polaroid (aparece sólo si existe la foto) ---------- */
.polaroid {
  align-self: center; margin: 0;
  width: min(78%, 280px);
  background: var(--blanco);
  padding: 10px 10px 34px;
  box-shadow: 0 6px 18px rgba(30, 41, 64, .18);
  transform: rotate(var(--rot, -2deg));
  position: relative;
}
.polaroid img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; background: var(--paper-2); }
.polaroid::before {
  content: ""; position: absolute; top: -12px; left: 50%; width: 84px; height: 24px;
  transform: translateX(-50%) rotate(3deg);
  background: color-mix(in srgb, var(--amarillo) 55%, transparent);
}

/* ---------- piezas comunes ---------- */
.nota {
  align-self: flex-start;
  max-width: 290px;
  border: 0;
  background: var(--amarillo);
  padding: 12px 16px 14px;
  text-align: left;
  box-shadow: 2px 4px 0 rgba(30, 41, 64, .15);
  transform: rotate(-1.5deg);
  transition: transform .2s var(--ease);
  min-height: 44px;
}
.nota:hover { transform: rotate(0); }
.nota .tapa { font-family: var(--f-script); font-weight: 700; font-size: 1.4rem; line-height: 1.1; }
.nota .dentro { display: block; font-size: 1.05rem; }
.nota[aria-expanded="false"] .dentro { display: none; }
.nota[aria-expanded="true"] .tapa { display: none; }

.cancion {
  display: flex; align-items: center; gap: 12px; align-self: stretch;
  border: 2px solid var(--ink); border-radius: 14px 18px 12px 20px;
  padding: 10px 14px; background: var(--blanco);
  text-decoration: none; color: var(--ink);
  transition: background-color .2s;
  min-height: 56px;
}
.cancion:hover { background: color-mix(in srgb, var(--azul-claro) 35%, var(--blanco)); }
.cancion .disco { flex: none; }
.cancion .info { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
.cancion .lbl { font-family: var(--f-script); font-weight: 700; font-size: 1.1rem; color: var(--naranja-os); }
.cancion .tit { font-size: 1.05rem; }
.cancion .ir { margin-left: auto; font-family: var(--f-script); font-weight: 700; font-size: 1.2rem; color: var(--azul); white-space: nowrap; }

.boton {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 48px; padding: 8px 24px;
  font-family: var(--f-marker); font-size: 1.1rem;
  background: var(--azul); color: var(--paper);
  border: 3px solid var(--ink);
  border-radius: 255px 18px 225px 18px / 18px 225px 18px 255px;
  box-shadow: 3px 4px 0 var(--ink);
  transition: transform .15s var(--ease), box-shadow .15s var(--ease);
  text-decoration: none;
}
.boton:hover { transform: translate(-1px, -1px); box-shadow: 4px 5px 0 var(--ink); }
.boton:active { transform: translate(2px, 3px); box-shadow: 1px 1px 0 var(--ink); }
.boton.sec { background: var(--paper); color: var(--ink); }
.boton.ama { background: var(--amarillo); color: var(--ink); }

.recuerdo {
  display: flex; gap: 12px; align-items: center; margin: 0;
  font-family: var(--f-script); font-size: 1.35rem; line-height: 1.15; color: var(--ink-soft);
  border-top: 2px dashed var(--gris-claro); padding-top: 14px;
}
.recuerdo svg { flex: none; }

.lista { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.lista li { display: flex; align-items: center; gap: 12px; }
.lista svg { flex: none; }

/* ---------- sellos + quiz ---------- */
.sello {
  flex: none; width: 64px; height: 64px; border-radius: 50%;
  display: grid; place-items: center; text-align: center;
  border: 3px double var(--naranja-os); color: var(--naranja-os);
  font-family: var(--f-marker); font-size: 1rem; line-height: 1;
  transform: rotate(-14deg);
  background: color-mix(in srgb, var(--naranja-claro) 25%, transparent);
}
.sello small { display: block; font-family: var(--f-script); font-size: .85rem; }
.sello.vacio { border-color: var(--gris-claro); color: var(--gris); background: none; border-style: dashed; }
.sello.nuevo { animation: estampa .5s var(--ease); }
@keyframes estampa { from { transform: rotate(-30deg) scale(2.2); opacity: 0; } to { transform: rotate(-14deg) scale(1); opacity: 1; } }

.quiz {
  border: 2px dashed var(--ink-soft); border-radius: 16px 20px 14px 22px;
  padding: 16px; display: flex; flex-direction: column; gap: 10px;
  background: color-mix(in srgb, var(--azul-claro) 18%, transparent);
}
.quiz .q-lbl { font-family: var(--f-script); font-weight: 700; font-size: 1.2rem; color: var(--naranja-os); line-height: 1; }
.quiz .q { margin: 0; font-size: 1.15rem; }
.quiz .ops { display: flex; flex-direction: column; gap: 8px; }
.quiz .op {
  min-height: 48px; text-align: left; padding: 8px 14px;
  background: var(--paper); border: 2px solid var(--ink);
  border-radius: 12px 16px 10px 18px;
  transition: background-color .2s, transform .2s;
}
.quiz .op:hover { background: color-mix(in srgb, var(--amarillo) 35%, var(--paper)); }
.quiz .op.mal { background: var(--gris-claro); text-decoration: line-through; color: var(--ink-soft); }
.quiz .op.bien { background: color-mix(in srgb, var(--verde) 25%, var(--paper)); border-color: var(--verde); }
.quiz .res { margin: 0; min-height: 1.4em; font-family: var(--f-script); font-weight: 700; font-size: 1.35rem; line-height: 1.1; }

/* ---------- tu versión ---------- */
details.version { border-top: 2px dashed var(--gris-claro); padding-top: 12px; }
details.version summary {
  cursor: pointer; list-style: none; min-height: 44px; display: flex; align-items: center; gap: 10px;
  font-family: var(--f-script); font-weight: 700; font-size: 1.45rem; color: var(--azul); line-height: 1.1;
}
details.version summary::-webkit-details-marker { display: none; }
details.version summary::before { content: "+"; font-family: var(--f-marker); width: 28px; height: 28px; display: grid; place-items: center; border: 2px solid currentColor; border-radius: 50%; font-size: 1rem; flex: none; }
details.version[open] summary::before { content: "–"; }
details.version p { margin: 6px 0 10px; }

textarea, input[type="text"] {
  width: 100%;
  font-family: var(--f-script); font-weight: 700; font-size: 1.55rem; line-height: 1.25;
  color: var(--ink);
  background: repeating-linear-gradient(0deg, transparent 0 31px, var(--azul-claro) 31px 32px), var(--blanco);
  border: 2px solid var(--ink-soft); border-radius: 10px 14px 8px 16px;
  padding: 4px 12px;
}
textarea { min-height: 110px; resize: vertical; }
input[type="text"] { min-height: 48px; background: var(--blanco); }
label.lbl { font-family: var(--f-script); font-weight: 700; font-size: 1.4rem; line-height: 1; }
.guardado { font-size: .9rem; color: var(--verde); min-height: 1.3em; margin: 0; }

/* ---------- cap I: celulares + sudadera ---------- */
.celus { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.celu {
  border: 3px solid var(--ink); border-radius: 22px; background: var(--blanco);
  padding: 10px 10px 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0;
  box-shadow: 3px 4px 0 rgba(30, 41, 64, .15);
}
.celu:nth-child(1) { transform: rotate(-2deg); }
.celu:nth-child(2) { transform: rotate(2deg); }
.celu .notch { width: 40%; height: 6px; border-radius: 6px; background: var(--ink); align-self: center; }
.celu .de { font-family: var(--f-script); font-weight: 700; font-size: 1.1rem; color: var(--naranja-os); line-height: 1; }
.celu .contacto { display: flex; align-items: center; gap: 8px; border-top: 1px solid var(--gris-claro); padding-top: 8px; min-width: 0; }
.celu .avatar { flex: none; width: 28px; height: 28px; font-size: .9rem; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-marker); color: var(--paper); }
.celu .nom { font-size: .92rem; line-height: 1.1; min-width: 0; }
.flip { border: 0; background: none; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; align-self: center; width: 100%; max-width: 300px; }
.flip .pista { font-family: var(--f-script); font-weight: 700; font-size: 1.2rem; color: var(--ink-soft); }

/* ---------- cap III: la caja ---------- */
.cajabtn { border: 0; background: none; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; align-self: center; width: 100%; max-width: 300px; }
.cajabtn .pista { font-family: var(--f-script); font-weight: 700; font-size: 1.3rem; color: var(--naranja-os); }
.servilletita {
  align-self: center; background: var(--blanco); padding: 18px 22px; transform: rotate(-3deg);
  box-shadow: 0 6px 16px rgba(30, 41, 64, .16);
  font-family: var(--f-script); font-weight: 700; font-size: 2rem; line-height: 1.1; text-align: center;
  background-image: linear-gradient(135deg, transparent 49.6%, rgba(30, 41, 64, .07) 50%, transparent 50.4%);
}

/* ---------- cap IV: acta + inventario ---------- */
.acta {
  border: 3px double var(--ink); padding: 18px 18px 16px; background: var(--blanco);
  transform: rotate(-1deg); display: flex; flex-direction: column; gap: 6px;
  box-shadow: 0 6px 16px rgba(30, 41, 64, .12);
}
.acta .titulo-acta { font-family: var(--f-marker); font-size: 1.25rem; text-align: center; letter-spacing: .04em; }
.acta .sub { text-align: center; font-size: .95rem; color: var(--ink-soft); margin: 0 0 6px; }
.acta dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; }
.acta dt { font-size: .85rem; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); padding-top: 4px; }
.acta dd { margin: 0; font-family: var(--f-script); font-weight: 700; font-size: 1.35rem; line-height: 1.15; border-bottom: 1px solid var(--gris-claro); min-width: 0; }
.acta .firmas { display: flex; justify-content: space-around; gap: 12px; margin-top: 10px; font-family: var(--f-script); font-weight: 700; font-size: 1.5rem; color: var(--azul); }
.inventario { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.inventario > div { min-width: 0; }
.inventario h4 { margin: 0 0 6px; font-family: var(--f-script); font-weight: 700; font-size: 1.35rem; color: var(--naranja-os); line-height: 1; }
.inventario ul { margin: 0; padding-left: 1.1em; display: flex; flex-direction: column; gap: 4px; font-size: 1rem; }

/* ---------- cap V: la nube ---------- */
.hoja.pausa { background: var(--paper-2); color: var(--ink-soft); }
.hoja.pausa h2 { color: var(--gris); }
.hoja.pausa .eyebrow { color: var(--gris); }
.nubebtn { border: 0; background: none; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; align-self: center; width: 100%; max-width: 300px; }
.nubebtn .nube-g, .nubebtn .sol-g { transition: transform 1.2s var(--ease), opacity 1.2s var(--ease); transform-box: fill-box; transform-origin: center; }
.nubebtn .sol-g { opacity: 0; transform: scale(.4); }
.nubebtn.despejada .nube-g { transform: translateX(120%); opacity: 0; }
.nubebtn.despejada .sol-g { opacity: 1; transform: scale(1); }
.nubebtn .pista { font-family: var(--f-script); font-weight: 700; font-size: 1.3rem; color: var(--gris); }
.revelado { font-family: var(--f-marker); font-size: 1.4rem; color: var(--azul); text-align: center; margin: 0; }

/* ---------- cap VII: cuaderno ---------- */
.cuaderno {
  align-self: center; width: min(100%, 300px); min-height: 220px;
  border: 3px solid var(--ink); border-radius: 6px 14px 14px 6px;
  background: var(--azul); color: var(--paper);
  padding: 22px 20px 22px 36px; position: relative; text-align: left;
  box-shadow: 4px 6px 0 rgba(30, 41, 64, .2);
  display: flex; flex-direction: column; justify-content: center; gap: 8px;
  transition: background-color .3s;
}
.cuaderno::before { content: ""; position: absolute; left: 12px; top: 10px; bottom: 10px; border-left: 3px dotted var(--paper); }
.cuaderno .c-tit { font-family: var(--f-marker); font-size: 1.45rem; line-height: 1.1; }
.cuaderno .c-sub { font-family: var(--f-script); font-weight: 700; font-size: 1.3rem; line-height: 1; color: var(--amarillo); }
.cuaderno .c-pista { font-family: var(--f-script); font-size: 1.1rem; opacity: .9; }
.cuaderno.abierto {
  background: repeating-linear-gradient(0deg, transparent 0 29px, var(--azul-claro) 29px 30px), var(--blanco);
  color: var(--ink);
}
.cuaderno.abierto::before { border-left: 2px solid var(--naranja); }
.cuaderno .pagina-c { font-family: var(--f-script); font-weight: 700; font-size: 1.6rem; line-height: 1.2; }
.cuaderno .pagina-c b { color: var(--naranja-os); font-weight: 700; }

/* ---------- cap VIII: frasco ---------- */
.frasco-wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.papelito {
  align-self: center; max-width: 320px; background: var(--blanco); padding: 14px 18px;
  font-family: var(--f-script); font-weight: 700; font-size: 1.55rem; line-height: 1.15; text-align: center;
  box-shadow: 0 5px 14px rgba(30, 41, 64, .15);
  transform: rotate(var(--r, 2deg));
  border-top: 6px solid var(--c, var(--naranja));
}
.papelito.sale { animation: sale .45s var(--ease); }
@keyframes sale { from { transform: translateY(40px) rotate(0) scale(.6); opacity: 0; } }

/* ---------- cap IX: música, boleto, futuro ---------- */
.discos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.discos a {
  display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: var(--ink);
  font-size: .95rem; text-align: center; line-height: 1.1; min-width: 0; padding: 6px 2px; border-radius: 12px;
  transition: background-color .2s;
}
.discos a:hover { background: color-mix(in srgb, var(--amarillo) 30%, transparent); }
.boleto {
  display: grid; grid-template-columns: 1fr auto; border: 3px solid var(--ink); background: var(--amarillo);
  border-radius: 10px; overflow: hidden; transform: rotate(-1.5deg);
  box-shadow: 3px 4px 0 rgba(30, 41, 64, .18);
}
.boleto .b-main { padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.boleto .b-art { font-family: var(--f-marker); font-size: 1.8rem; line-height: 1; }
.boleto .b-fecha { font-size: 1rem; }
.boleto .b-stub { border-left: 3px dashed var(--ink); padding: 10px 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--paper); text-align: center; }
.boleto .b-num { font-family: var(--f-marker); font-size: 1.9rem; line-height: 1; font-variant-numeric: tabular-nums; }
.boleto .b-lbl { font-family: var(--f-script); font-weight: 700; font-size: 1.05rem; line-height: 1; }

/* ---------- interludio: el tiempo ---------- */
.reloj-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.reloj-grid div {
  border: 2px solid var(--ink); border-radius: 14px 18px 12px 20px; background: var(--blanco);
  padding: 10px 6px; text-align: center; display: flex; flex-direction: column; gap: 2px; min-width: 0;
}
.reloj-grid b { font-family: var(--f-marker); font-weight: 400; font-size: clamp(1.6rem, 8vw, 2.2rem); line-height: 1; font-variant-numeric: tabular-nums; color: var(--azul); }

/* ---------- barra: el camino ---------- */
.camino {

  transition: background-color .2s;
}
.flecha:hover:not(:disabled) { background: color-mix(in srgb, var(--amarillo) 45%, transparent); }

.ruta { width: 100%; height: 40px; overflow: visible; }
.ruta .calle { fill: none; stroke: var(--gris-claro); stroke-width: 12; stroke-linecap: round; }
.ruta .raya { fill: none; stroke: var(--paper); stroke-width: 2; stroke-dasharray: 6 6; }
.ruta .parada { fill: var(--paper); stroke: var(--gris); stroke-width: 2; }
.ruta .parada.hecha { fill: var(--azul); stroke: var(--azul); }
.ruta #marcador { transition: transform .5s var(--ease); }
.pagina { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: var(--f-script); font-size: 1.1rem; color: var(--ink-soft); text-align: center; line-height: 1; margin-top: -2px; }

canvas#confeti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 40; }

@media (max-width: 380px) {

@media (min-width: 600px) {

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }

/* ---------- navegación ---------- */
let actual = 0;
const N = hojas.length;
const $atras = document.getElementById("atras");
const $adelante = document.getElementById("adelante");
const $pagina = document.getElementById("pagina");
const rutaPath = document.getElementById("rutaPath");
const $paradas = document.getElementById("paradas");
const $marcador = document.getElementById("marcador");
const largo = rutaPath.getTotalLength();
const puntos = hojas.map((_, i) => rutaPath.getPointAtLength(largo * i / (N - 1)));
$paradas.innerHTML = puntos.map(p => `<circle class="parada" cx="${p.x}" cy="${p.y}" r="3"/>`).join("");

function ir(i) {
  actual = Math.max(0, Math.min(N - 1, i));
  hojas.forEach((h, j) => {
    h.el.dataset.pos = j < actual ? "antes" : j > actual ? "despues" : "";
    h.el.inert = j !== actual;
  });
  hojas[actual].el.scrollTop = 0;
  $atras.disabled = actual === 0;
  $adelante.disabled = actual === N - 1;
  const p = puntos[actual];
  $marcador.setAttribute("transform", `translate(${p.x} ${p.y - 8})`);
  [...$paradas.children].forEach((c, j) => c.classList.toggle("hecha", j <= actual));
  $pagina.textContent = hojas[actual].etiqueta;
  if (actual === IDX_EPILOGO) armarResumen();
}

$atras.onclick = () => ir(actual - 1);
$adelante.onclick = () => ir(actual + 1);
document.addEventListener("keydown", e => {
  if (e.target.closest("textarea, input")) return;
  if (e.key === "ArrowRight") ir(actual + 1);
  if (e.key === "ArrowLeft") ir(actual - 1);
});

let x0 = null, y0 = null;
$h.addEventListener("pointerdown", e => {
  if (e.target.closest("button, textarea, input, a, summary")) { x0 = null; return; }
  x0 = e.clientX; y0 = e.clientY;
});
$h.addEventListener("pointerup", e => {
  if (x0 === null) return;
  const dx = e.clientX - x0, dy = e.clientY - y0;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.3) ir(actual + (dx < 0 ? 1 : -1));
  x0 = null;
});

function pintarSellos() {
  document.querySelectorAll("[data-cuenta-sellos]").forEach(b => b.textContent = sellos.size);
  document.querySelectorAll("[data-mini]").forEach(m => m.classList.toggle("si", sellos.has(+m.dataset.mini)));
  document.querySelectorAll("[data-sellos-row]").forEach(r => {
    r.innerHTML = CAPITULOS.map((_, i) => sellos.has(i) ? selloHTML(i) : selloVacio(i)).join("");
  });
}
function ganarSello(i) {
  if (sellos.has(i)) return;
  sellos.add(i);
  mem.set("sellos", [...sellos]);
  const slot = document.querySelector(`[data-sello-slot="${i}"]`);
  if (slot) slot.innerHTML = selloHTML(i, true);
  pintarSellos();
}

/* ---------- interacciones ---------- */
const dos = (btn) => { const c = btn.querySelectorAll(".cara"); c[0].hidden = !c[0].hidden; c[1].hidden = !c[1].hidden; return !c[0].hidden; };
let papelitosQuedan = [];

document.addEventListener("click", e => {
  const ir_ = e.target.closest("[data-ir]");
  if (ir_) { ir(+ir_.dataset.ir); return; }

  const n = e.target.closest(".nota");
  if (n) { n.setAttribute("aria-expanded", n.getAttribute("aria-expanded") === "true" ? "false" : "true"); return; }

  const f = e.target.closest("[data-flip]");
  if (f) { const frente = dos(f); f.querySelector(".pista").textContent = frente ? "tócala para voltearla" : "otra vez de frente"; return; }

  const cj = e.target.closest("[data-caja]");
  if (cj) {
    const cerrada = dos(cj);
    cj.querySelector(".pista").textContent = cerrada ? "ábrela" : "ciérrala";
    cj.parentElement.querySelector("[data-caja-txt]").hidden = cerrada;
    return;
  }

  const nb = e.target.closest("[data-nube]");
  if (nb) {
    nb.classList.add("despejada");
    nb.querySelector(".pista").textContent = "";
    nb.parentElement.querySelector("[data-nube-txt]").hidden = false;
    ganarSello(CAPITULOS.findIndex(c => c.pausa));
    return;
  }

  const cu = e.target.closest("[data-cuaderno]");
  if (cu) {
    const abierto = cu.classList.toggle("abierto");
    cu.querySelector(".tapa-c").hidden = abierto;
    cu.querySelector(".pagina-c").hidden = !abierto;
    cu.setAttribute("aria-label", abierto ? "Cerrar el cuaderno" : "Abrir el cuaderno");
    return;
  }

  const fr = e.target.closest("[data-frasco]");
  if (fr) {
    if (!papelitosQuedan.length) papelitosQuedan = PAPELITOS.map((_, i) => i).sort(() => Math.random() - .5);
    const [t, c] = PAPELITOS[papelitosQuedan.pop()];
    const p = fr.parentElement.querySelector("[data-papelito]");
    p.hidden = false;
    p.textContent = t;
    p.style.setProperty("--c", c);
    p.style.setProperty("--r", (Math.random() * 6 - 3).toFixed(1) + "deg");
    p.classList.remove("sale"); void p.offsetWidth; p.classList.add("sale");
    fr.textContent = papelitosQuedan.length ? "Saca otro" : "Ya los sacaste todos. ¿Otra vez?";
    return;
  }

  const op = e.target.closest(".op");
  if (op) {
    const qz = op.closest("[data-quiz]");
    const i = +qz.dataset.quiz;
    const q = CAPITULOS[i].quiz;
    const res = qz.querySelector(".res");
    if (+op.dataset.op === q.ok) {
      qz.querySelectorAll(".op").forEach(b => b.disabled = true);
      op.classList.add("bien");

/* ---------- contadores ---------- */
function diferencia(a, b) {
  let y = b.getFullYear() - a.getFullYear();
  let m = b.getMonth() - a.getMonth();
  if (m < 0) { y--; m += 12; }
  let ancla = new Date(a.getFullYear() + y, a.getMonth() + m, a.getDate(), a.getHours(), a.getMinutes());
  if (ancla > b) { m--; if (m < 0) { y--; m += 12; } ancla = new Date(a.getFullYear() + y, a.getMonth() + m, a.getDate(), a.getHours(), a.getMinutes()); }
  let r = Math.floor((b - ancla) / 1000);
  const d = Math.floor(r / 86400); r -= d * 86400;
  const h = Math.floor(r / 3600); r -= h * 3600;
  const min = Math.floor(r / 60);
  return { y, m, d, h, min, s: r - min * 60 };
}
const $t = k => document.querySelector(`[data-t="${k}"]`);
function tic() {
  const ahora = new Date();
  const df = diferencia(PRIMER_SI, ahora);
  for (const k in df) { const el = $t(k); if (el) el.textContent = df[k]; }
  const total = Math.floor((ahora - PRIMER_SI) / 864e5).toLocaleString("es-MX");
  document.querySelectorAll("[data-dias-total]").forEach(b => b.textContent = total);
  const faltan = Math.max(0, Math.ceil((NSQK - ahora) / 864e5));
  document.querySelectorAll("[data-faltan]").forEach(b => b.textContent = faltan);
}

const $si = document.getElementById("btnSi");

function huir(e) {
  if (e) e.preventDefault();
  intentos++;
  $noTxt.textContent = frasesNo[Math.min(intentos - 1, frasesNo.length - 1)];
  $si.style.transform = `scale(${Math.min(1 + intentos * .12, 1.7)})`;
  const r = $no.getBoundingClientRect();
  $no.classList.add("huye");
  const w = r.width, h = r.height, m = 16;
  $no.style.left = (m + Math.random() * Math.max(0, innerWidth - w - m * 2)) + "px";
  $no.style.top = (m + Math.random() * Math.max(0, innerHeight - h - 120)) + "px";
  if (intentos >= 7) $no.hidden = true;
}
$no.addEventListener("pointerenter", e => { if (e.pointerType === "mouse") huir(); });
$no.addEventListener("pointerdown", huir);

/* ---------- confeti ---------- */
function confeti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = document.getElementById("confeti");
  cv.hidden = false;
  const ctx = cv.getContext("2d");
  const dpr = devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const css = getComputedStyle(document.documentElement);
  const colores = ["--azul", "--naranja", "--amarillo", "--verde", "--gris", "--azul-claro"].map(v => css.getPropertyValue(v).trim());
  const ps = Array.from({ length: 160 }, () => ({
    x: innerWidth / 2 + (Math.random() - .5) * 80, y: innerHeight * .55,
    vx: (Math.random() - .5) * 13, vy: -Math.random() * 15 - 6,
    r: Math.random() * Math.PI, vr: (Math.random() - .5) * .3,
    s: 6 + Math.random() * 7, c: colores[Math.floor(Math.random() * colores.length)],
    h: Math.random() < .3
  }));
  const t0 = performance.now();
  (function paso(t) {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    ps.forEach(p => {
      p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;
      if (p.h) {
        const s = p.s / 7;
        ctx.scale(s, s);
        ctx.beginPath(); ctx.moveTo(0, 6);
        ctx.bezierCurveTo(-11, -4, -8, -13, 0, -7); ctx.bezierCurveTo(8, -13, 11, -4, 0, 6); ctx.fill();
      } else ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
      ctx.restore();
    });
    if (t - t0 < 3800) requestAnimationFrame(paso); else { ctx.clearRect(0, 0, innerWidth, innerHeight); cv.hidden = true; }
  })(t0);
}

function mostrarFirmado(texto, cuando) {
  document.getElementById("frase").textContent = "«" + texto + "»";

  const fecha = hoyTxt();

};

function armarResumen() {
  const v = mem.get("versiones", {});
  const lineas = ["Libro «Nosotros» — lo que escribí yo, " + ELLA, ""];
  lineas.push(`Sellos: ${sellos.size} de ${TOTAL_SELLOS}`);
  if (mem.get("si", null)) lineas.push("Respuesta en la servilleta: SÍ");
  const g = mem.get("gato", "");
  if (g) lineas.push("El gato se va a llamar: " + g);
  const e = mem.get("epilogo", null);
  if (e && e.t) lineas.push("Nuestra frase: «" + e.t + "»");
  const caps = CAPITULOS.map((c, i) => v[i] ? `\nCap. ${romanos[i]} · ${c.titulo}\n${v[i]}` : "").filter(Boolean);
  if (caps.length) { lineas.push("", "Mi versión:"); lineas.push(...caps); }
  else lineas.push("", "(Todavía no escribes tu versión de ningún capítulo.)");
  const txt = lineas.join("\n");
  document.getElementById("resumen").textContent = txt;
  document.getElementById("whats").href = "https://wa.me/?text=" + encodeURIComponent(txt);
  return txt;
}
document.getElementById("copiar").onclick = () => {
  const txt = armarResumen();
  const av = document.getElementById("avisoCopiar");
  const fallback = () => {
    const r = document.createRange(); r.selectNodeContents(document.getElementById("resumen"));
    const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    av.textContent = "Ya está seleccionado: cópialo con el menú del celular.";
  };
  try { navigator.clipboard.writeText(txt).then(() => av.textContent = "Copiado.", fallback); } catch (err) { fallback(); }
};
