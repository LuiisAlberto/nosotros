<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nosotros · Edith y Luis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Figtree:wght@400;500;600;700;800&family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,400;1,9..144,500&family=Unbounded:wght@600;700;800&display=swap">
<style>
/* Layout: la historia es un disco. Portada + lista de canciones; cada capítulo es un track cuya letra (la historia) aparece línea por línea, con recuerdos pegados como en un álbum de fotos. Look único oscuro, sin modo claro. */
:root {
  color-scheme: dark;
  --app: #121212;
  --app-2: #1E1E1E;
  --app-3: #2A2A2A;
  --txt: #F4F4F4;
  --txt-2: #B3B3B3;
  --papel: #FBF7EF;
  --papel-2: #F1EADC;
  --tinta: #24211D;
  --tinta-2: #5E574D;
  --cinta: rgba(255, 201, 61, .72);
  --verde-play: #34A56F;

  --ink: #24211D; --ink-soft: #5E574D; --paper: #FBF7EF; --blanco: #FFFFFF;
  --azul: #2F6BD8; --azul-claro: #AFC9F4;
  --naranja: #F2892B; --naranja-os: #C9581A; --naranja-claro: #F7B777;
  --gris: #8C96A8; --gris-claro: #D5DAE3;
  --amarillo: #FFC93D; --verde: #34A56F; --cafe: #9A6A44;

  --f-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --f-ui: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-serif: "Fraunces", Georgia, serif;
  --f-maquina: "Courier Prime", "Courier New", ui-monospace, monospace;

  --ease: cubic-bezier(.2, .7, .2, 1);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: #000; color: var(--txt); font-family: var(--f-ui); font-size: 17px; line-height: 1.5; overflow: hidden; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--txt); outline-offset: 3px; border-radius: 6px; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.maquina { font-family: var(--f-maquina); }
.mono { font-family: var(--f-maquina); font-size: .8rem; letter-spacing: .04em; }

/* ---------- app ---------- */
.app { position: relative; height: 100%; max-width: 480px; margin: 0 auto; background: var(--app); overflow: hidden; display: grid; grid-template-rows: 1fr auto; }
.vistas { position: relative; overflow: hidden; }
.vista { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; animation: entra .45s var(--ease); }
@keyframes entra { from { opacity: 0; transform: translateY(14px); } }

/* ---------- inicio (portada del disco) ---------- */
.inicio { background: linear-gradient(180deg, #2F5FB8 0, #1B2F5C 340px, var(--app) 620px); }
.inicio .pad { padding: 24px 20px 40px; display: flex; flex-direction: column; gap: 18px; }
.portada-arte { position: relative; width: min(100%, 340px); aspect-ratio: 1; align-self: center; border-radius: 6px; overflow: hidden; background: var(--naranja); box-shadow: 0 24px 50px rgba(0, 0, 0, .5); }
.portada-arte .c1 { position: absolute; width: 120%; aspect-ratio: 1; border-radius: 50%; background: var(--azul); left: -62%; bottom: -66%; }
.portada-arte .c2 { position: absolute; width: 62%; aspect-ratio: 1; border-radius: 50%; background: var(--amarillo); right: -14%; top: -14%; mix-blend-mode: multiply; }
.portada-arte .c3 { position: absolute; width: 30%; aspect-ratio: 1; border-radius: 50%; background: var(--verde); right: 10%; bottom: 8%; }
.portada-arte .pol { position: absolute; left: 50%; top: 47%; width: 56%; transform: translate(-50%, -50%) rotate(-5deg); background: var(--blanco); padding: 8px 8px 30px; box-shadow: 0 10px 22px rgba(0, 0, 0, .3); }
.portada-arte .pol .foto { aspect-ratio: 1; background: var(--azul-claro); display: grid; place-items: center; overflow: hidden; }
.portada-arte .pol .foto img { width: 100%; height: 100%; object-fit: cover; }
.portada-arte .pol .foto svg { width: 92%; }
.portada-arte .pol .pie { position: absolute; left: 0; right: 0; bottom: 7px; text-align: center; font-family: var(--f-maquina); font-size: .72rem; color: var(--tinta); }
.portada-arte .cinta { position: absolute; width: 34%; height: 9%; background: var(--cinta); left: 33%; top: 15%; transform: rotate(4deg); }
.portada-arte .titulo-arte { position: absolute; left: 7%; bottom: 6%; font-family: var(--f-display); font-weight: 800; font-size: clamp(1.4rem, 7.5vw, 2rem); line-height: .9; letter-spacing: -.03em; color: var(--tinta); }
.disco-info { display: flex; flex-direction: column; gap: 6px; }
.disco-info h1 { margin: 0; font-family: var(--f-display); font-weight: 800; font-size: clamp(1.9rem, 9vw, 2.4rem); letter-spacing: -.03em; line-height: 1; }
.disco-info .artista { display: flex; align-items: center; gap: 8px; font-weight: 700; }
.disco-info .artista .av { width: 26px; height: 26px; border-radius: 50%; background: var(--naranja); display: grid; place-items: center; font-size: .7rem; color: var(--tinta); font-weight: 800; }
.disco-info .meta { color: var(--txt-2); font-size: .9rem; }
.contador-linea { font-family: var(--f-serif); font-style: italic; font-size: 1.15rem; color: var(--txt); margin: 0; }
.contador-linea b { font-family: var(--f-ui); font-style: normal; font-weight: 800; color: var(--amarillo); }
.acciones { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.acciones .mini { color: var(--txt-2); font-size: .85rem; }
.play-grande { width: 60px; height: 60px; border-radius: 50%; border: 0; background: var(--verde-play); color: #121212; display: grid; place-items: center; flex: none; transition: transform .15s var(--ease); box-shadow: 0 8px 20px rgba(52, 165, 111, .35); }
.play-grande:hover { transform: scale(1.05); }
.play-grande:active { transform: scale(.96); }
.tracklist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.tracklist button { width: 100%; min-height: 60px; display: grid; grid-template-columns: 28px 1fr auto; gap: 14px; align-items: center; background: none; border: 0; border-radius: 8px; padding: 8px 8px; text-align: left; transition: background-color .2s; }
.tracklist button:hover { background: var(--app-2); }
.tracklist .i { color: var(--txt-2); text-align: right; font-variant-numeric: tabular-nums; }
.tracklist .nom { font-weight: 600; line-height: 1.2; display: block; }
.tracklist .sub { color: var(--txt-2); font-size: .82rem; display: block; }
.tracklist .on .nom { color: var(--verde-play); }
.tracklist .oro { width: 22px; height: 22px; }
.seccion-t { margin: 8px 0 0; font-family: var(--f-display); font-weight: 700; font-size: 1.1rem; letter-spacing: -.01em; }
.nota-papel { background: var(--papel); color: var(--tinta); padding: 18px 18px 16px; transform: rotate(-1deg); position: relative; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 8px 18px rgba(0, 0, 0, .35); }
.nota-papel::before { content: ""; position: absolute; width: 80px; height: 22px; background: var(--cinta); top: -10px; left: 24px; transform: rotate(-4deg); }
.nota-papel ol { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 6px; font-size: .95rem; }
.nota-papel h3 { margin: 0; font-family: var(--f-maquina); font-weight: 700; font-size: .95rem; }

/* ---------- track (capítulo) ---------- */
.track { background: var(--bg); color: var(--tt); }
.track .pad { padding: 14px 20px 60px; display: flex; flex-direction: column; gap: 22px; min-height: 100%; }
.t-head { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 8px; text-align: center; }
.t-head .lbl { font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; opacity: .9; }
.icono { width: 44px; height: 44px; border-radius: 50%; border: 0; background: transparent; display: grid; place-items: center; }
.icono:hover { background: color-mix(in srgb, var(--tt) 12%, transparent); }
.arte { position: relative; width: min(78%, 300px); align-self: center; background: var(--blanco); padding: 10px 10px 36px; transform: rotate(var(--rot, -2deg)); box-shadow: 0 18px 40px rgba(0, 0, 0, .35); }
.arte .cuadro { aspect-ratio: 1; background: var(--papel-2); display: grid; place-items: center; overflow: hidden; }
.arte .cuadro img { width: 100%; height: 100%; object-fit: cover; }
.arte .cuadro svg { width: 90%; height: auto; }
.arte .pie { position: absolute; left: 0; right: 0; bottom: 9px; text-align: center; font-family: var(--f-maquina); font-size: .78rem; color: var(--tinta); }
.arte::before { content: ""; position: absolute; width: 90px; height: 24px; background: var(--cinta); top: -11px; left: 50%; transform: translateX(-50%) rotate(3deg); z-index: 1; }
.t-info { display: flex; justify-content: space-between; align-items: center; gap: 14px; }
.t-info h2 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: clamp(1.4rem, 6.6vw, 1.75rem); letter-spacing: -.02em; line-height: 1.1; text-wrap: balance; }
.t-info p { margin: 4px 0 0; opacity: .82; font-size: .92rem; }
.t-info > div { min-width: 0; }

/* letra */
.letra { display: flex; flex-direction: column; gap: 22px; cursor: pointer; padding-bottom: 8px; }
.ly { transition: opacity .5s var(--ease), transform .5s var(--ease); }
.ly[data-e="futuro"] { display: none; }
.ly[data-e="pasado"] { opacity: .5; }
.ly[data-e="actual"] { animation: aparece .6s var(--ease); }
@keyframes aparece { from { opacity: 0; transform: translateY(16px); } }
.ly p { margin: 0; font-weight: 800; font-size: clamp(1.45rem, 6.4vw, 1.7rem); line-height: 1.28; letter-spacing: -.015em; text-wrap: pretty; }
.ly .sec { display: block; margin-bottom: 10px; font-family: var(--f-maquina); font-weight: 700; font-size: .85rem; letter-spacing: .02em; opacity: .85; }
.ly .script, .ly em { font-family: var(--f-serif); font-style: italic; font-weight: 500; letter-spacing: 0; }
.ly .script { font-size: 1.08em; }
.ly.blk[data-e="pasado"] { opacity: 1; }
.siguele { align-self: center; display: inline-flex; align-items: center; gap: 8px; font-size: .8rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; opacity: .8; }
.siguele::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: late 1.4s ease-in-out infinite; }
@keyframes late { 50% { transform: scale(1.7); opacity: .4; } }

/* recuerdos pegados (papel) */
.insert { position: relative; background: var(--papel); color: var(--tinta); padding: 22px 18px 18px; transform: rotate(var(--r, -1deg)); box-shadow: 0 12px 26px rgba(0, 0, 0, .28); display: flex; flex-direction: column; gap: 12px; cursor: default; font-size: 1rem; }
.insert::before { content: ""; position: absolute; width: 86px; height: 22px; background: var(--cinta); top: -11px; left: 22px; transform: rotate(-4deg); }
.insert:nth-of-type(even) { --r: 1.2deg; }
.insert:nth-of-type(even)::before { left: auto; right: 22px; transform: rotate(5deg); }
.insert p { margin: 0; }
.doodle { width: 100%; max-width: 260px; height: auto; align-self: center; overflow: visible; }
.doodle .k { stroke: var(--tinta); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.f-none { fill: none; } .f-ink { fill: var(--tinta); } .f-paper { fill: var(--papel); } .f-blanco { fill: var(--blanco); }
.f-azul { fill: var(--azul); } .f-azul-claro { fill: var(--azul-claro); } .f-naranja { fill: var(--naranja); } .f-naranja-os { fill: var(--naranja-os); }
.f-naranja-claro { fill: var(--naranja-claro); } .f-gris { fill: var(--gris); } .f-gris-claro { fill: var(--gris-claro); }
.f-amarillo { fill: var(--amarillo); } .f-verde { fill: var(--verde); } .f-cafe { fill: var(--cafe); }
.t-marker { font-family: var(--f-display); font-weight: 800; }
.t-script { font-family: var(--f-serif); font-style: italic; }

.flip, .cajabtn, .nubebtn { border: 0; background: none; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; align-self: center; width: 100%; max-width: 280px; }
.pista { font-family: var(--f-maquina); font-size: .85rem; color: var(--tinta-2); display: inline-flex; align-items: center; gap: 8px; }
.pista::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--naranja); animation: late 1.4s ease-in-out infinite; }
.lead { font-family: var(--f-serif); font-style: italic; font-size: 1.3rem; line-height: 1.25; margin: 0; }
.centro { text-align: center; align-self: center; }

.celus { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.celu { border-radius: 22px; background: #111; padding: 6px; min-width: 0; }
.celu .pantalla { background: var(--blanco); border-radius: 17px; padding: 10px 10px 14px; display: flex; flex-direction: column; gap: 8px; }
.celu .notch { width: 36%; height: 5px; border-radius: 6px; background: #111; align-self: center; }
.celu .de { color: var(--tinta-2); font-family: var(--f-maquina); font-size: .78rem; }
.celu .contacto { display: flex; align-items: center; gap: 8px; border-top: 1px solid var(--gris-claro); padding-top: 8px; min-width: 0; }
.celu .avatar { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: .85rem; color: var(--blanco); }
.celu .nom { font-weight: 700; font-size: .9rem; line-height: 1.1; min-width: 0; }

.servilletita { align-self: center; background: var(--blanco); padding: 18px 22px; transform: rotate(-3deg); box-shadow: 0 6px 14px rgba(0, 0, 0, .12); font-family: var(--f-serif); font-style: italic; font-size: 1.8rem; line-height: 1.1; text-align: center; background-image: linear-gradient(135deg, transparent 49.7%, rgba(36, 33, 29, .07) 50%, transparent 50.3%); }

.acta { display: flex; flex-direction: column; gap: 8px; border: 1px solid var(--tinta-2); outline: 1px solid var(--tinta-2); outline-offset: 4px; padding: 16px 14px; margin: 5px; }
.acta .titulo-acta { font-family: var(--f-maquina); font-weight: 700; font-size: 1.1rem; text-align: center; letter-spacing: .1em; }
.acta .sub { text-align: center; color: var(--tinta-2); margin: 0 0 6px; font-size: .8rem; }
.acta dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; }
.acta dt { font-family: var(--f-maquina); font-size: .78rem; color: var(--tinta-2); padding-top: 4px; }
.acta dd { margin: 0; font-family: var(--f-serif); font-style: italic; font-size: 1.15rem; line-height: 1.2; border-bottom: 1px dotted var(--tinta-2); min-width: 0; }
.acta .firmas { display: flex; justify-content: space-around; gap: 12px; margin-top: 10px; font-family: var(--f-serif); font-style: italic; font-size: 1.35rem; color: var(--azul); }

.inventario { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.inventario > div { min-width: 0; }
.inventario h4 { margin: 0 0 6px; font-family: var(--f-maquina); font-weight: 700; font-size: .9rem; color: var(--naranja-os); }
.inventario ul { margin: 0; padding-left: 1.05em; display: flex; flex-direction: column; gap: 4px; font-size: .92rem; line-height: 1.35; }

.nubebtn .nube-g, .nubebtn .sol-g { transition: transform 1.2s var(--ease), opacity 1.2s var(--ease); transform-box: fill-box; transform-origin: center; }
.nubebtn .sol-g { opacity: 0; transform: scale(.4); }
.nubebtn.despejada .nube-g { transform: translateX(120%); opacity: 0; }
.nubebtn.despejada .sol-g { opacity: 1; transform: scale(1); }
.revelado { font-family: var(--f-serif); font-style: italic; font-size: 1.5rem; line-height: 1.15; color: var(--azul); text-align: center; margin: 0; }

.cuaderno { align-self: center; width: min(100%, 280px); min-height: 210px; border: 0; border-radius: 4px 14px 14px 4px; background: var(--azul); color: var(--blanco); padding: 24px 20px 24px 36px; position: relative; text-align: left; box-shadow: inset 10px 0 0 rgba(0, 0, 0, .2), 0 8px 18px rgba(0, 0, 0, .2); display: flex; flex-direction: column; justify-content: center; gap: 10px; }
.cuaderno .c-tit { font-family: var(--f-display); font-weight: 800; font-size: 1.35rem; line-height: 1.05; letter-spacing: -.02em; }
.cuaderno .c-sub { font-family: var(--f-serif); font-style: italic; font-size: 1.3rem; line-height: 1; color: var(--amarillo); }
.cuaderno .c-pista { font-family: var(--f-maquina); font-size: .8rem; opacity: .9; }
.cuaderno.abierto { background: var(--blanco); background-image: repeating-linear-gradient(0deg, transparent 0 29px, var(--azul-claro) 29px 30px); color: var(--tinta); box-shadow: inset 2px 0 0 var(--naranja), 0 8px 18px rgba(0, 0, 0, .14); }
.cuaderno .pagina-c { font-family: var(--f-serif); font-style: italic; font-size: 1.5rem; line-height: 1.2; }
.cuaderno .pagina-c b { font-family: var(--f-maquina); font-style: normal; font-size: .85rem; color: var(--naranja-os); }

.frasco-wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.papelito { align-self: center; max-width: 300px; background: var(--blanco); padding: 14px 16px; font-family: var(--f-serif); font-style: italic; font-size: 1.3rem; line-height: 1.2; text-align: center; box-shadow: 0 6px 14px rgba(0, 0, 0, .14); border-top: 6px solid var(--c, var(--naranja)); transform: rotate(var(--r, 2deg)); }
.papelito.sale { animation: sale .45s var(--ease); }
@keyframes sale { from { transform: translateY(40px) rotate(0) scale(.6); opacity: 0; } }

.discos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.discos a { display: flex; flex-direction: column; align-items: center; gap: 6px; text-decoration: none; text-align: center; min-width: 0; padding: 8px 2px; border-radius: 10px; font-weight: 700; font-size: .9rem; line-height: 1.1; transition: background-color .2s; }
.discos a:hover { background: var(--papel-2); }
.disco { animation: gira 6s linear infinite; }
@keyframes gira { to { transform: rotate(360deg); } }
.lista { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.lista li { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px dotted var(--tinta-2); }
.lista li:last-child { border-bottom: 0; }
.lista svg { flex: none; }
.lista .pend { font-family: var(--f-serif); font-style: italic; color: var(--naranja-os); }
.boleto { display: grid; grid-template-columns: 1fr auto; background: var(--amarillo); border-radius: 10px; overflow: hidden; }
.boleto .b-main { padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.boleto .b-art { font-family: var(--f-display); font-weight: 800; font-size: 2rem; line-height: .95; letter-spacing: -.02em; }
.boleto .b-stub { border-left: 2px dashed var(--tinta); padding: 10px 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--papel); text-align: center; }
.boleto .b-num { font-family: var(--f-display); font-weight: 800; font-size: 1.9rem; line-height: 1; font-variant-numeric: tabular-nums; }
label.lbl { font-weight: 700; }
input[type="text"], textarea { width: 100%; color: var(--tinta); background: var(--blanco); border: 1px solid var(--tinta-2); border-radius: 10px; padding: 10px 12px; font-family: var(--f-serif); font-style: italic; font-size: 1.25rem; line-height: 1.3; }
input[type="text"] { min-height: 50px; }
textarea { min-height: 120px; resize: vertical; }
input[type="text"]:focus, textarea:focus { outline: 2px solid var(--azul); outline-offset: 1px; }
.guardado { font-family: var(--f-maquina); font-size: .8rem; color: var(--verde); min-height: 1.2em; margin: 0; }
.col { display: flex; flex-direction: column; gap: 10px; }
.fila { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

.reloj-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.reloj-grid div { border-radius: 10px; padding: 14px 4px 10px; text-align: center; display: flex; flex-direction: column; gap: 4px; min-width: 0; color: var(--blanco); }
.reloj-grid div:nth-child(1) { background: var(--azul); }
.reloj-grid div:nth-child(2) { background: var(--naranja-os); }
.reloj-grid div:nth-child(3) { background: #2E8B57; }
.reloj-grid b { font-family: var(--f-display); font-weight: 800; font-size: clamp(2rem, 11vw, 2.8rem); line-height: .9; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.reloj-grid span { font-family: var(--f-maquina); font-size: .82rem; }
.dato { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: baseline; }
.dato b { font-family: var(--f-display); font-weight: 800; font-size: 2rem; line-height: 1; color: var(--naranja-os); font-variant-numeric: tabular-nums; }

/* ---------- outro del track ---------- */
.outro { display: flex; flex-direction: column; gap: 18px; padding-top: 10px; border-top: 1px solid color-mix(in srgb, var(--tt) 25%, transparent); animation: entra .5s var(--ease); }
.outro .fin { font-family: var(--f-maquina); font-weight: 700; font-size: .85rem; letter-spacing: .04em; opacity: .85; text-align: center; }

/* ---------- canciones: capítulos + interludio + final + epílogo ---------- */
function versosDe(escenas) {
  const out = [];
  let etiqueta = null;
  escenas.forEach(e => {
    if (e.bloque) { out.push({ b: e.bloque, sec: etiqueta }); etiqueta = null; return; }
    const ps = e.p || [];
    if (!ps.length) { etiqueta = e.t || etiqueta; return; }
    ps.forEach((t, j) => { out.push({ t, sec: j === 0 ? (e.t || etiqueta) : null }); });
    etiqueta = null;
  });
  return out;
}

  const versos = t.versos.map((v, n) => {
    const sec = v.sec ? `<span class="sec">— ${v.sec}</span>` : "";
    if (v.b) return `<div class="ly blk" data-n="${n}" data-e="futuro">${sec}<div class="insert">${BLOQUES[v.b]()}</div></div>`;
    return `<div class="ly" data-n="${n}" data-e="futuro">${sec}<p>${v.t}</p></div>`;

const revelado = mem.get("revelado", {});
let vistaActual = 0, trackActual = -1, sonando = false, tmr = null;

function mostrar(idx) {
  vistas.forEach((v, j) => { v.el.hidden = j !== idx; v.el.inert = j !== idx; });
  vistaActual = idx;
  const v = vistas[idx];
  v.el.scrollTop = 0;
  v.el.style.animation = "none"; void v.el.offsetWidth; v.el.style.animation = "";
}
function irInicio() { pausar(); trackActual = -1; $player.hidden = true; mostrar(0); pintarOros(); }
function irTrack(k) {
  pausar();
  trackActual = k;
  mostrar(k + 1);
  $player.hidden = false;
  const t = TRACKS[k];
  $pTitulo.textContent = t.titulo;
  $pSub.textContent = `${ELLA} & ${EL} · canción ${k + 1} de ${TRACKS.length}`;
  $pPrev.disabled = k === 0;
  if (!revelado[k]) { revelado[k] = 1; guardarRevelado(); }
  pintarTrack(k, false);
  if (revelado[k] < TRACKS[k].versos.length) reproducir();
  if (t.tipo === "epilogo") armarResumen();
}
function guardarRevelado() { mem.set("revelado", revelado); }
function pintarTrack(k, desplazar) {
  const el = vistas[k + 1].el;
  const n = revelado[k] || 0;
  const total = TRACKS[k].versos.length;
  el.querySelectorAll("[data-letra] .ly").forEach(ly => {
    const j = +ly.dataset.n;
    ly.dataset.e = j < n - 1 ? "pasado" : j === n - 1 ? "actual" : "futuro";
  });
  const completo = n >= total;
  el.querySelector("[data-outro]").hidden = !completo;
  el.querySelector("[data-siguele]").hidden = completo;
  $pBarra.style.width = (Math.min(n, total) / total * 100) + "%";
  $pNext.disabled = completo;
  if (completo) pausar();
  if (desplazar) {
    const actual = el.querySelector('.ly[data-e="actual"]');
    if (actual) actual.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "center" });
  }
}
function avanzar() {
  if (trackActual < 0) return;
  const k = trackActual, total = TRACKS[k].versos.length;
  if ((revelado[k] || 0) >= total) return;
  revelado[k] = (revelado[k] || 0) + 1;
  guardarRevelado();
  pintarTrack(k, true);
  if (revelado[k] >= total) {
    setTimeout(() => { const o = vistas[k + 1].el.querySelector("[data-outro]"); o.scrollIntoView({ behavior: "smooth", block: "start" }); }, 900);
  }
  if (sonando) programar();
}
function espera() {
  const k = trackActual, v = TRACKS[k].versos[(revelado[k] || 1) - 1];
  if (!v) return 3000;
  if (v.b) return 7000;
  const largo = v.t.replace(/<[^>]+>/g, "").length;
  return Math.min(8000, 1800 + largo * 42);
}
function programar() { clearTimeout(tmr); tmr = setTimeout(avanzar, espera()); }
function reproducir() {
  if (trackActual < 0) return;
  if ((revelado[trackActual] || 0) >= TRACKS[trackActual].versos.length) return;
  sonando = true; actualizarPlay(); programar();
}
function pausar() { sonando = false; clearTimeout(tmr); actualizarPlay(); }
function actualizarPlay() {
  document.getElementById("icoPlay").hidden = sonando;
  document.getElementById("icoPausa").hidden = !sonando;
  $pPlay.setAttribute("aria-label", sonando ? "Pausar" : "Reproducir");
}
$pPlay.onclick = () => sonando ? pausar() : reproducir();
$pNext.onclick = () => avanzar();
$pPrev.onclick = () => { if (trackActual > 0) irTrack(trackActual - 1); };

document.addEventListener("keydown", e => {
  if (e.target.closest("textarea, input")) return;
  if (trackActual >= 0 && (e.key === " " || e.key === "ArrowRight")) { e.preventDefault(); avanzar(); }
  if (e.key === "Escape") irInicio();
});

/* ---------- discos de oro ---------- */
function pintarOros() {
  document.querySelectorAll("[data-cuenta-sellos]").forEach(b => b.textContent = sellos.size);
  document.querySelectorAll("[data-oro-lista]").forEach(s => { const i = s.dataset.oroLista; s.innerHTML = i === "" ? "" : (sellos.has(+i) ? oro(true) : ""); });
  document.querySelectorAll("[data-oro-slot]").forEach(s => { const i = s.dataset.oroSlot; s.innerHTML = i === "" ? "" : oro(sellos.has(+i)); });
  document.querySelectorAll("[data-oros]").forEach(r => r.innerHTML = CAPITULOS.map((_, i) => oro(sellos.has(i))).join(""));
}
function ganarSello(i) {
  if (sellos.has(i)) return;
  sellos.add(i);
  mem.set("sellos", [...sellos]);
  pintarOros();
  const slot = document.querySelector(`[data-oro-slot="${i}"]`);
  if (slot) slot.innerHTML = oro(true, true);
}

/* ---------- toques ---------- */
const dos = (btn) => { const c = btn.querySelectorAll(".cara"); c[0].hidden = !c[0].hidden; c[1].hidden = !c[1].hidden; return !c[0].hidden; };
let papelitosQuedan = [];

document.addEventListener("click", e => {
  const tr = e.target.closest("[data-track]");
  if (tr) { irTrack(+tr.dataset.track); return; }
  if (e.target.closest("[data-inicio]")) { irInicio(); return; }
  if (e.target.closest("[data-play-album]")) {
    const k = TRACKS.findIndex((t, j) => (revelado[j] || 0) < t.versos.length);
    irTrack(k < 0 ? 0 : k);
    return;
  }

  const n = e.target.closest(".nota");
  if (n) {
    const abierta = n.getAttribute("aria-expanded") === "true";
    n.setAttribute("aria-expanded", abierta ? "false" : "true");
    n.querySelector(".tapa").textContent = abierta ? "nota al margen · toca para leer" : "nota al margen";
    return;
  }
  const f = e.target.closest("[data-flip]");
  if (f) { const frente = dos(f); f.querySelector(".pista").textContent = frente ? "tócala para voltearla" : "otra vez de frente"; return; }
  const cj = e.target.closest("[data-caja]");
  if (cj) {
    const cerrada = dos(cj);
    cj.querySelector(".pista").textContent = cerrada ? "ábrela" : "ciérrala";
    cj.parentElement.querySelector("[data-caja-txt]").hidden = cerrada;
    return;
  }
  const nb = e.target.closest("[data-nube]");
  if (nb) {
    nb.classList.add("despejada");
    nb.querySelector(".pista").hidden = true;
    nb.parentElement.querySelector("[data-nube-txt]").hidden = false;
    ganarSello(CAPITULOS.findIndex(c => c.pausa));
    return;
  }
  const cu = e.target.closest("[data-cuaderno]");
  if (cu) {
    const abierto = cu.classList.toggle("abierto");
    cu.querySelector(".tapa-c").hidden = abierto;
    cu.querySelector(".pagina-c").hidden = !abierto;
    cu.setAttribute("aria-label", abierto ? "Cerrar el cuaderno" : "Abrir el cuaderno");
    return;
  }
  const fr = e.target.closest("[data-frasco]");
  if (fr) {
    if (!papelitosQuedan.length) papelitosQuedan = PAPELITOS.map((_, i) => i).sort(() => Math.random() - .5);
    const [t, c] = PAPELITOS[papelitosQuedan.pop()];
    const p = fr.parentElement.querySelector("[data-papelito]");
    p.hidden = false; p.textContent = t;
    p.style.setProperty("--c", c);
    p.style.setProperty("--r", (Math.random() * 6 - 3).toFixed(1) + "deg");
    p.classList.remove("sale"); void p.offsetWidth; p.classList.add("sale");
    fr.textContent = papelitosQuedan.length ? "Saca otro" : "Ya los sacaste todos. ¿Otra vez?";
    return;
  }
  const op = e.target.closest(".op");
  if (op) {
    const qz = op.closest("[data-quiz]");
    const i = +qz.dataset.quiz;
    const q = CAPITULOS[i].quiz;
    const res = qz.querySelector(".res");
    if (+op.dataset.op === q.ok) {
      qz.querySelectorAll(".op").forEach(b => b.disabled = true);
      op.classList.add("bien");
      res.textContent = q.bien + " Disco de oro ganado.";
      res.style.color = "#1F7A4C";
      ganarSello(i);
    } else {
      op.classList.add("mal"); op.disabled = true;
      res.textContent = ["Casi. Intenta otra vez.", "Mmm, no. Piénsale.", "Esa no. Te queda una."][qz.querySelectorAll(".op.mal").length - 1] || "Inténtalo otra vez.";
      res.style.color = "var(--naranja-os)";
    }
    return;
  }
  /* tocar la letra = siguiente línea */
  const letra = e.target.closest("[data-letra]");
  if (letra && !e.target.closest(".insert, a, button, input, textarea")) avanzar();
});

/* quizzes ya ganados */
CAPITULOS.forEach((c, i) => {
  if (!c.quiz || !sellos.has(i)) return;
  const qz = document.querySelector(`[data-quiz="${i}"]`);
  qz.querySelectorAll(".op").forEach(b => b.disabled = true);
  qz.querySelector(`[data-op="${c.quiz.ok}"]`).classList.add("bien");

});

/* ---------- contadores: meses, semanas y días ---------- */
function mesesSemanasDias(a, b) {
  let meses = (b.getFullYear() - a.getFullYear()) * 12 + (b.getMonth() - a.getMonth());
  if (b.getDate() < a.getDate()) meses--;
  const ancla = new Date(a.getFullYear(), a.getMonth() + meses, a.getDate());
  const hoy = new Date(b.getFullYear(), b.getMonth(), b.getDate());
  const resto = Math.round((hoy - ancla) / 864e5);
  return { meses, semanas: Math.floor(resto / 7), dias: resto % 7 };
}
const plural = (n, uno, varios) => `${n} ${n === 1 ? uno : varios}`;
function tic() {
  const ahora = new Date();
  const t = mesesSemanasDias(PRIMER_SI, ahora);
  for (const k in t) document.querySelectorAll(`[data-t="${k}"]`).forEach(el => el.textContent = t[k]);
  const partes = [plural(t.meses, "mes", "meses")];
  if (t.semanas) partes.push(plural(t.semanas, "semana", "semanas"));
  if (t.dias) partes.push(plural(t.dias, "día", "días"));
  const txt = partes.length > 1 ? partes.slice(0, -1).join(", ") + " y " + partes[partes.length - 1] : partes[0];
  document.querySelectorAll("[data-msd-largo]").forEach(el => el.innerHTML = txt.replace(/(\d+)/g, "<b>$1</b>"));
  const faltan = Math.max(0, Math.ceil((NSQK - ahora) / 864e5));
  document.querySelectorAll("[data-faltan]").forEach(b => b.textContent = faltan);
}
tic(); setInterval(tic, 60000);

/* ---------- la pregunta ---------- */
const $si = document.getElementById("btnSi");
const $no = document.getElementById("btnNo");
const $noTxt = document.getElementById("noTxt");
const frasesNo = ["¿Segura?", "Piénsalo", "¿Neta?", "Ese no sirve", "Dale al sí"];
let intentos = 0;
function huir(e) {
  if (e) e.preventDefault();
  intentos++;
  $noTxt.textContent = frasesNo[Math.min(intentos - 1, frasesNo.length - 1)];
  $si.style.transform = `scale(${Math.min(1 + intentos * .12, 1.7)})`;
  const r = $no.getBoundingClientRect();
  $no.classList.add("huye");
  const w = r.width, h = r.height, m = 16;
  $no.style.left = (m + Math.random() * Math.max(0, innerWidth - w - m * 2)) + "px";
  $no.style.top = (m + Math.random() * Math.max(0, innerHeight - h - 140)) + "px";
  if (intentos >= 7) $no.hidden = true;
}
$no.addEventListener("pointerenter", e => { if (e.pointerType === "mouse") huir(); });
$no.addEventListener("pointerdown", huir);
$no.addEventListener("click", huir);
function decirSi(animar) {
  $si.classList.add("marcado");
  $si.style.transform = "";
  $no.hidden = true;
  const r = document.getElementById("respuesta");
  r.hidden = false;
  if (animar) {
    mem.set("si", new Date().toISOString());
    setTimeout(() => r.scrollIntoView({ behavior: "smooth", block: "center" }), 350);
    confeti();
  }
}
$si.addEventListener("click", () => decirSi(true));
if (mem.get("si", null)) decirSi(false);

/* ---------- confeti ---------- */
function confeti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = document.getElementById("confeti");
  cv.hidden = false;
  const ctx = cv.getContext("2d");
  const dpr = devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const colores = ["#2F6BD8", "#F2892B", "#FFC93D", "#34A56F", "#AFC9F4", "#E8B730"];
  const ps = Array.from({ length: 160 }, () => ({
    x: innerWidth / 2 + (Math.random() - .5) * 80, y: innerHeight * .55,
    vx: (Math.random() - .5) * 13, vy: -Math.random() * 15 - 6,
    r: Math.random() * Math.PI, vr: (Math.random() - .5) * .3,
    s: 6 + Math.random() * 7, c: colores[Math.floor(Math.random() * colores.length)],
    h: Math.random() < .3
  }));
  const t0 = performance.now();
  (function paso(t) {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    ps.forEach(p => {
      p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;
      if (p.h) {
        const s = p.s / 7;
        ctx.scale(s, s);
        ctx.beginPath(); ctx.moveTo(0, 6);
        ctx.bezierCurveTo(-11, -4, -8, -13, 0, -7); ctx.bezierCurveTo(8, -13, 11, -4, 0, 6); ctx.fill();
      } else ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
      ctx.restore();
    });
    if (t - t0 < 3800) requestAnimationFrame(paso); else { ctx.clearRect(0, 0, innerWidth, innerHeight); cv.hidden = true; }
  })(t0);
}

/* ---------- epílogo ---------- */
const $ta = document.getElementById("epilogo");
const $editor = document.getElementById("editor");
const $firmado = document.getElementById("firmado");
const $aviso = document.getElementById("aviso");
const hoyTxt = () => new Date().toLocaleDateString("es-MX", { day: "numeric", month: "long", year: "numeric" });
function mostrarFirmado(texto, cuando) {
  document.getElementById("frase").textContent = "«" + texto + "»";
  document.getElementById("firma").textContent = `${ELLA} & ${EL} · ${cuando}`;
  $editor.hidden = true;
  $firmado.hidden = false;
}
document.querySelectorAll(".idea").forEach(b => b.onclick = () => { $ta.value = b.textContent; $ta.focus(); });
document.getElementById("guardar").onclick = () => {
  const t = $ta.value.trim();
  if (!t) { $aviso.textContent = "Escriban algo primero. Aunque sea una palabra."; $ta.focus(); return; }
  const fecha = hoyTxt();
  mem.set("epilogo", { t, fecha });
  mostrarFirmado(t, fecha);
  armarResumen();
  confeti();
};
document.getElementById("editar").onclick = () => { $firmado.hidden = true; $editor.hidden = false; $ta.focus(); };
const ep = mem.get("epilogo", null);
if (ep && ep.t) { $ta.value = ep.t; mostrarFirmado(ep.t, ep.fecha); }

function armarResumen() {
  const v = mem.get("versiones", {});
  const lineas = ["Disco «Nosotros» — lo que escribí yo, " + ELLA, ""];
  lineas.push(`Discos de oro: ${sellos.size} de ${TOTAL_SELLOS}`);
  if (mem.get("si", null)) lineas.push("Respuesta en la servilleta: SÍ");
  const g = mem.get("gato", "");
  if (g) lineas.push("El gato se va a llamar: " + g);
  const e = mem.get("epilogo", null);
  if (e && e.t) lineas.push("Nuestra frase: «" + e.t + "»");
  const caps = CAPITULOS.map((c, i) => v[i] ? `\n${i + 1}. ${c.titulo}\n${v[i]}` : "").filter(Boolean);
  if (caps.length) { lineas.push("", "Mi versión:"); lineas.push(...caps); }
  else lineas.push("", "(Todavía no escribes tu versión de ninguna canción.)");
  const txt = lineas.join("\n");
  document.getElementById("resumen").textContent = txt;
  document.getElementById("whats").href = "https://wa.me/?text=" + encodeURIComponent(txt);
  return txt;
}
document.getElementById("copiar").onclick = () => {
  const txt = armarResumen();
  const av = document.getElementById("avisoCopiar");
  const fallback = () => {
    const r = document.createRange(); r.selectNodeContents(document.getElementById("resumen"));
    const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    av.textContent = "Ya está seleccionado: cópialo con el menú del celular.";
  };
  try { navigator.clipboard.writeText(txt).then(() => av.textContent = "Copiado.", fallback); } catch (err) { fallback(); }
};

pintarOros();
armarResumen();
mostrar(0);
